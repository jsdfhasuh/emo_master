# Pilot branch fixture ONLY. Never place this file on product main.
name: P0 product event witness
on:
  push:
    branches: [dot/p0-proof-base-20261124]
  pull_request_target:
    branches: [dot/p0-proof-base-20261124]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions: {}
jobs:
  witness:
    name: Trusted product event witness
    runs-on: ubuntu-latest
    timeout-minutes: 4
    if: >-
      github.repository == 'jsdfhasuh/emo_master' &&
      (github.ref == 'refs/heads/dot/p0-proof-base-20261124' ||
       (github.event_name == 'workflow_dispatch' &&
        startsWith(github.ref, 'refs/tags/ci-p0-proof-'))) &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.id == github.event.repository.id)
    steps:
      - name: Verify real GitHub event context (no checkout)
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          sha = re.compile(r"[a-f0-9]{40}")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          source = os.environ["GITHUB_EVENT_NAME"]
          assert event["repository"]["id"] == 1343796337
          if source == "push":
              assert event["ref"] == "refs/heads/dot/p0-proof-base-20261124"
              assert event["after"] == os.environ["GITHUB_SHA"] and sha.fullmatch(event["after"])
          elif source == "pull_request_target":
              pr = event["pull_request"]
              assert pr["base"]["ref"] == "dot/p0-proof-base-20261124"
              assert pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1343796337
              assert pr["base"]["sha"] == os.environ["GITHUB_SHA"]
              assert sha.fullmatch(pr["head"]["sha"])
          else:
              assert source == "workflow_dispatch"
              assert os.environ["GITHUB_REF"].startswith("refs/tags/ci-p0-proof-")
          print("P0 real product event witness: " + source)
