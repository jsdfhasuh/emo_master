name: CI

on:
  push:
    branches: [main, agent/runtime-workflow-architecture-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scope:
    name: Select source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            /scripts/ci_scope.py
            /tests/test_ci_scope.py
          sparse-checkout-cone-mode: false
      - name: Verify source check selection
        run: python -m unittest discover -s tests -p test_ci_scope.py -v
      - name: Select source checks
        id: changes
        run: python scripts/ci_scope.py
  validate:
    needs: scope
    # Keep the existing Linux check even for docs/Web-only changes or a failed selector.
    if: ${{ !cancelled() }}
    name: ubuntu-latest / Python 3.10
    runs-on: ubuntu-latest
    # Full Linux checks reached the 45-minute job cap after passing; allow setup and cleanup.
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Report source check selection
        shell: python
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
        run: |
          import os
          if os.environ['SCOPE_RESULT'] != 'success' or os.environ['RUN_FULL'] not in ('true', 'false'):
              raise SystemExit('Source check selection failed; this check cannot pass.')
          if os.environ['RUN_FULL'] == 'false':
              message = 'Full source checks were not run: only passive documentation and/or independent Web files changed.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n')
      - uses: actions/checkout@v4
        if: needs.scope.outputs.run_full == 'true'
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.run_full == 'true'
        with:
          python-version: '3.10'
      - name: Install dependencies
        if: needs.scope.outputs.run_full == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Run project checks
        if: needs.scope.outputs.run_full == 'true'
        run: python scripts/ci_check.py
      - name: Upload test results
        if: always() && needs.scope.outputs.run_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu-latest-py3.10
          path: |
            build/ci-results.xml
            build/ci-failures.log
            build/two-job-observation.json
          if-no-files-found: ignore
  windows:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Windows source (${{ matrix.shard }}) / Python 3.10
    runs-on: windows-latest
    # Separate native desktops; each shard remains serial and every test is bounded at 120s.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [designer-ui, runtime-other]
    env:
      # Both groups contain Qt tests. Offscreen QPA crashes while rendering QMessageBox.
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure native Windows test desktop
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Verify native Windows test desktop
        shell: python
        env:
          PYTHONPATH: src
        run: |
          import json
          import emo_master
          from PySide2.QtWidgets import QApplication
          app = QApplication([])
          screen = app.primaryScreen()
          geometry = screen.geometry()
          print(json.dumps({"platform": app.platformName(),
              "geometry": geometry.getRect(),
              "available": screen.availableGeometry().getRect(),
              "scale": screen.devicePixelRatio()}), flush=True)
          assert app.platformName() == "windows"
          assert geometry.width() >= 1920 and geometry.height() >= 1080
      - name: Run project checks
        run: python scripts/ci_check.py --shard ${{ matrix.shard }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-latest-py3.10-${{ matrix.shard }}
          path: |
            build/ci-results.xml
            build/ci-failures.log
            build/two-job-observation.json
            build/ci-shard.json
          if-no-files-found: ignore
  windows-summary:
    needs: [scope, windows]
    if: ${{ always() }}
    # Preserve the original required check name; neither shard can pass this gate alone.
    name: windows-latest / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source selection and Windows jobs
        shell: python
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
          SHARDS_RESULT: ${{ needs.windows.result }}
        run: |
          import os
          if os.environ['SCOPE_RESULT'] != 'success' or os.environ['RUN_FULL'] not in ('true', 'false'):
              raise SystemExit('Source check selection failed; this check cannot pass.')
          if os.environ['RUN_FULL'] == 'false':
              if os.environ['SHARDS_RESULT'] != 'skipped':
                  raise SystemExit('Unexpected Windows shard result for skipped source checks.')
              message = 'Full source checks were not run: only passive documentation and/or independent Web files changed.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n')
          elif os.environ['SHARDS_RESULT'] != 'success':
              raise SystemExit('Windows source shards did not all succeed.')
      - uses: actions/checkout@v4
        if: needs.scope.outputs.run_full == 'true'
        with:
          sparse-checkout: /scripts/ci_shard_summary.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.run_full == 'true'
        with:
          pattern: test-results-windows-latest-py3.10-*
          path: build/windows-shards
      - name: Verify complete Windows test coverage
        if: needs.scope.outputs.run_full == 'true'
        run: >-
          python scripts/ci_shard_summary.py
          build/windows-shards/test-results-windows-latest-py3.10-designer-ui/ci-shard.json
          build/windows-shards/test-results-windows-latest-py3.10-runtime-other/ci-shard.json
