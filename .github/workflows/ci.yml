name: CI

on:
  push:
    branches: [main, agent/runtime-workflow-architecture-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  manual-receipt-pilot:
    if: github.repository_id == '1343796337' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dot/source-manual-receipt-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Stage bounded request without checkout or cross-repository secret
        shell: python
        run: |
          import json, os, re
          from pathlib import Path

          def need(ok):
              if not ok:
                  raise SystemExit("source shadow request refused")

          env = os.environ
          need(env["GITHUB_REPOSITORY_ID"] == "1343796337")
          ref = "refs/heads/dot/source-manual-receipt-pilot"
          need(env["GITHUB_REF"] == ref)
          sha = env["GITHUB_SHA"]
          need(bool(re.fullmatch(r"[0-9a-f]{40}", sha)) and sha != "0" * 40)
          run, attempt = env["GITHUB_RUN_ID"], env["GITHUB_RUN_ATTEMPT"]
          need(bool(re.fullmatch(r"[1-9][0-9]{0,19}",run)))
          need(bool(re.fullmatch(r"[1-9][0-9]{0,5}",attempt)))
          body = Path(env["GITHUB_EVENT_PATH"]).read_bytes()
          need(len(body) <= 32 * 1024 * 1024)
          payload = json.loads(body)
          need(payload.get("repository",{}).get("id") == 1343796337)
          event = env["GITHUB_EVENT_NAME"]
          before = None
          if event == "push":
              need(payload.get("ref") == ref and payload.get("after") == sha and payload.get("deleted") is False)
              before = payload.get("before")
              need(isinstance(before,str) and bool(re.fullmatch(r"[0-9a-f]{40}", before)))
              if before == "0"*40:
                  before = None
          else:
              need(event == "workflow_dispatch" and payload.get("ref") in (ref, ref.removeprefix("refs/heads/"))
                   and not payload.get("inputs"))
          record = dict(source_event_name=event, source_ref=ref, source_repository_id=1343796337,
                        source_head_sha=sha, source_base_sha=None, source_merge_sha=None,
                        source_before_sha=before, source_pr_number=None, check_sha=sha, execution_sha=sha,
                        request_id=f"{run}-{attempt}")
          with (Path(env["RUNNER_TEMP"]) / "ci-request.json").open("x", encoding="ascii") as out:
              json.dump(record, out, sort_keys=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-request.json
          if-no-files-found: error
          retention-days: 3

  scope:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dot/source-manual-receipt-pilot') }}
    name: Select source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: |
            /scripts/ci_scope.py
            /tests/test_ci_scope.py
          sparse-checkout-cone-mode: false
      - name: Verify source check selection
        run: python -m unittest discover -s tests -p test_ci_scope.py -v
      - name: Select source checks
        id: changes
        run: python scripts/ci_scope.py
  linux:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Linux source (${{ matrix.shard }}) / Python 3.10
    runs-on: ubuntu-latest
    # Independent runners; each shard keeps the existing serial test execution.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime, other]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run project checks
        run: python scripts/ci_check.py --shard ${{ matrix.shard }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-latest-py3.10-${{ matrix.shard }}
          path: |
            build/ci-results.xml
            build/ci-failures.log
            build/two-job-observation.json
            build/ci-shard.json
          if-no-files-found: ignore
  windows:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Windows source (${{ matrix.shard }}) / Python 3.10
    runs-on: windows-latest
    # Separate native desktops; each shard remains serial and every test is bounded at 120s.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [runtime, other]
    env:
      # Both groups contain Qt tests. Offscreen QPA crashes while rendering QMessageBox.
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure native Windows test desktop
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Verify native Windows test desktop
        shell: python
        env:
          PYTHONPATH: src
        run: |
          import json
          import emo_master
          from PySide2.QtWidgets import QApplication
          app = QApplication([])
          screen = app.primaryScreen()
          geometry = screen.geometry()
          print(json.dumps({"platform": app.platformName(),
              "geometry": geometry.getRect(),
              "available": screen.availableGeometry().getRect(),
              "scale": screen.devicePixelRatio()}), flush=True)
          assert app.platformName() == "windows"
          assert geometry.width() >= 1920 and geometry.height() >= 1080
      - name: Run project checks
        run: python scripts/ci_check.py --shard ${{ matrix.shard }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-latest-py3.10-${{ matrix.shard }}
          path: |
            build/ci-results.xml
            build/ci-failures.log
            build/two-job-observation.json
            build/ci-shard.json
          if-no-files-found: ignore
  linux-summary:
    needs: [scope, linux]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dot/source-manual-receipt-pilot') }}
    # Keep the original Linux check for full runs, scope skips and selector failures.
    name: ubuntu-latest / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source selection and Linux jobs
        shell: python
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
          SHARDS_RESULT: ${{ needs.linux.result }}
        run: |
          import os
          if os.environ['SCOPE_RESULT'] != 'success' or os.environ['RUN_FULL'] not in ('true', 'false'):
              raise SystemExit('Source check selection failed; this check cannot pass.')
          if os.environ['RUN_FULL'] == 'false':
              if os.environ['SHARDS_RESULT'] != 'skipped':
                  raise SystemExit('Unexpected Linux shard result for skipped source checks.')
              message = 'Full source checks were not run: only passive documentation and/or independent Web files changed.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n')
          elif os.environ['SHARDS_RESULT'] != 'success':
              raise SystemExit('Linux source shards did not all succeed.')
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_full == 'true'
        with:
          sparse-checkout: /scripts/ci_shard_summary.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.run_full == 'true'
        with:
          pattern: test-results-ubuntu-latest-py3.10-*
          path: build/linux-shards
      - name: Verify complete Linux test coverage
        if: needs.scope.outputs.run_full == 'true'
        run: >-
          python scripts/ci_shard_summary.py
          build/linux-shards/test-results-ubuntu-latest-py3.10-runtime/ci-shard.json
          build/linux-shards/test-results-ubuntu-latest-py3.10-other/ci-shard.json
  windows-summary:
    needs: [scope, windows]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dot/source-manual-receipt-pilot') }}
    # Preserve the original required check name; neither shard can pass this gate alone.
    name: windows-latest / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source selection and Windows jobs
        shell: python
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
          SHARDS_RESULT: ${{ needs.windows.result }}
        run: |
          import os
          if os.environ['SCOPE_RESULT'] != 'success' or os.environ['RUN_FULL'] not in ('true', 'false'):
              raise SystemExit('Source check selection failed; this check cannot pass.')
          if os.environ['RUN_FULL'] == 'false':
              if os.environ['SHARDS_RESULT'] != 'skipped':
                  raise SystemExit('Unexpected Windows shard result for skipped source checks.')
              message = 'Full source checks were not run: only passive documentation and/or independent Web files changed.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n')
          elif os.environ['SHARDS_RESULT'] != 'success':
              raise SystemExit('Windows source shards did not all succeed.')
      - uses: actions/checkout@v7
        if: needs.scope.outputs.run_full == 'true'
        with:
          sparse-checkout: /scripts/ci_shard_summary.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.run_full == 'true'
        with:
          pattern: test-results-windows-latest-py3.10-*
          path: build/windows-shards
      - name: Verify complete Windows test coverage
        if: needs.scope.outputs.run_full == 'true'
        run: >-
          python scripts/ci_shard_summary.py
          build/windows-shards/test-results-windows-latest-py3.10-runtime/ci-shard.json
          build/windows-shards/test-results-windows-latest-py3.10-other/ci-shard.json
