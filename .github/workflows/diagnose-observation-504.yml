name: Diagnose two-job observation at 504

on:
  push:
    branches: [codex/diagnose-observation-504-20261106]

permissions:
  contents: read

jobs:
  observation:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
      PYTHONPATH: src;scripts/diagnostics
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify fixed product and test baseline
        shell: python
        run: |
          import json, pathlib, subprocess
          baseline = "504c1c35db4f80a55b236a2f51adda78a38b1d28"
          allowed = {"scripts/diagnostics/observation_probe.py",
                     ".github/workflows/diagnose-observation-504.yml"}
          changed = subprocess.check_output(["git", "diff", "--name-only", baseline, "HEAD"], text=True).splitlines()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          output = pathlib.Path("build/observation-diagnose")
          output.mkdir(parents=True, exist_ok=True)
          report = {"baseline": baseline, "diagnosticHead": head, "changedPaths": changed}
          (output / "source.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          assert set(changed) <= allowed, report
      - name: Install the existing test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure native Windows test desktop
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Record and verify desktop and dependencies
        shell: python
        run: |
          import json, pathlib, platform, subprocess, sys
          import emo_master
          from PySide2.QtWidgets import QApplication
          output = pathlib.Path("build/observation-diagnose")
          app = QApplication([])
          screen = app.primaryScreen()
          geometry = screen.geometry()
          report = {"platform": platform.platform(), "python": sys.version,
                    "qtPlatform": app.platformName(), "geometry": geometry.getRect(),
                    "available": screen.availableGeometry().getRect(),
                    "scale": screen.devicePixelRatio()}
          print(json.dumps(report), flush=True)
          (output / "desktop.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          (output / "dependencies.txt").write_bytes(subprocess.check_output([sys.executable, "-m", "pip", "freeze"]))
          assert app.platformName() == "windows", report
          assert geometry.width() >= 1920 and geometry.height() >= 1080, report
      - name: Observe the original page-designer prefix through the unchanged target
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          output = pathlib.Path("build/observation-diagnose")
          target_file = "test_two_job_observation.py"
          target = "tests/ui/page_designer/" + target_file + "::testTwoCompletedNormalJobsChooseCurrentObserveFreezeResumeAndRetire"
          # Original run 42153848036 / Windows job 127683201304:
          # 377 passed, 0 skipped, then this one failed target. The SHA uses
          # UTF-8 nodeids joined by LF, including one final LF.
          expected_count = 378
          expected_order_sha256 = "bc556595e6f87eddefed222485be4d08e9039af45d31a76cd448a53fb61eaaed"
          modules = sorted(path.as_posix() for path in pathlib.Path("tests/ui/page_designer").glob("test_*.py")
                           if path.name < target_file)
          assert len(modules) == 38, modules
          selectors = [*modules, target]
          selection = {"originalRunId": 42153848036, "originalJobId": 127683201304,
                       "scope": "original page_designer prefix through the target in one pytest process",
                       "originalStates": {"passed": 377, "failed": 1, "skipped": 0, "errors": 0},
                       "selectors": selectors, "expectedCount": expected_count,
                       "expectedOrderSha256": expected_order_sha256}
          (output / "selection.json").write_text(json.dumps(selection, indent=2), encoding="utf-8")
          stem = output / "page-designer-prefix-378"
          probe = stem.with_suffix(".jsonl")
          env = dict(os.environ, EMO_OBSERVATION_PROBE_OUTPUT=str(probe.resolve()))
          command = [sys.executable, "-m", "pytest", "-p", "observation_probe", "-v", "--tb=short",
                     *selectors, "--timeout=120", "--timeout-method=thread", "-o", "faulthandler_timeout=60",
                     f"--junitxml={stem.with_suffix('.xml')}"]
          with stem.with_suffix(".log").open("wb") as log:
              code = subprocess.run(command, env=env, stdout=log, stderr=subprocess.STDOUT).returncode
          print(stem.with_suffix(".log").read_text(encoding="utf-8", errors="replace"), flush=True)
          records, diagnostic_errors, actual_nodeids, skipped = [], [], [], []
          case_states = []
          try:
              records = [json.loads(line) for line in probe.read_text(encoding="utf-8").splitlines()] if probe.exists() else []
              diagnostic_errors.extend(record["diagnosticError"] for record in records if "diagnosticError" in record)
              if stem.with_suffix(".xml").exists():
                  cases = list(ET.parse(stem.with_suffix(".xml")).getroot().iter("testcase"))
                  actual_nodeids = [case.attrib["classname"].replace(".", "/") + ".py::" + case.attrib["name"] for case in cases]
                  skipped = [case.attrib["name"] for case in cases if case.find("skipped") is not None]
                  for nodeid, case in zip(actual_nodeids, cases):
                      state = ("failed" if case.find("failure") is not None else
                               "error" if case.find("error") is not None else
                               "skipped" if case.find("skipped") is not None else "passed")
                      case_states.append({"nodeid": nodeid, "state": state, "seconds": case.attrib.get("time")})
          except Exception as error:
              diagnostic_errors.append(f"diagnostic result parsing: {type(error).__name__}: {error}")
          canonical_nodeids = ("\n".join(actual_nodeids) + "\n").encode("utf-8")
          actual_order_sha256 = hashlib.sha256(canonical_nodeids).hexdigest()
          (output / "actual-nodeids.txt").write_bytes(canonical_nodeids)
          (output / "case-states.json").write_text(json.dumps(case_states, indent=2), encoding="utf-8")
          stages = [record["stage"] for record in records]
          result = {"pytestExitCode": code, "stages": stages, "diagnosticErrors": diagnostic_errors,
                    "actualNodeIds": actual_nodeids, "actualCount": len(actual_nodeids),
                    "actualOrderSha256": actual_order_sha256, "expectedOrderSha256": expected_order_sha256,
                    "orderMatches": actual_order_sha256 == expected_order_sha256, "skipped": skipped}
          (output / "context-result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          if code:
              sys.exit(code)
          assert not diagnostic_errors, diagnostic_errors
          assert len(actual_nodeids) == expected_count and actual_order_sha256 == expected_order_sha256, result
          assert not skipped, skipped
          assert stages == ["job_1_image", "job_1_observer_image", "job_2_image", "job_2_observer_image"], stages
      - name: Upload the bounded context diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-504-windows-page-prefix-attempt${{ github.run_attempt }}
          path: build/observation-diagnose/
          if-no-files-found: error
