name: Emit an authenticated-event candidate receipt (no credentials)
on:
  workflow_call:
permissions:
  contents: read
jobs:
  request:
    if: >-
      github.repository_id == '1343796337' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.id == '1343796337' &&
         github.event.pull_request.base.repo.id == '1343796337'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci_cutover
      - name: Emit bounded native event evidence without uploading payload
        run: python3 -I scripts/ci_cutover/request_emitter.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-request.json
          if-no-files-found: error
          retention-days: 3
