name: Two-scope image failure diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/multiscope-ci-diagnostics.yml'
      - 'tests/ui/page_designer/test_retained_acceptance_multiscope.py'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run at most eight original two-scope cases, stopping on first failure
        shell: python
        run: |
          import subprocess
          import sys
          target = 'tests/ui/page_designer/test_retained_acceptance_multiscope.py'
          command = [sys.executable, '-m', 'pytest', '-p', 'scripts.ci_pytest_reports',
                     '--keep-duplicates', *([target] * 8),
                     '-k', 'testNormalTwoScopeOverviewButtonsPinGuiNgDespiteNewerBackgroundOk',
                     '-x', '-vv', '--tb=long', '--junitxml=build/multiscope-diagnostics.xml',
                     '--timeout=120', '--timeout-method=thread', '-o', 'faulthandler_timeout=60']
          raise SystemExit(subprocess.call(command))
      - name: Preserve original failures and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiscope-image-diagnostics
          path: |
            build/multiscope-diagnostics.xml
            build/ci-failures.log
          if-no-files-found: warn
