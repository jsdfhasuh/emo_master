name: Product Source shadow request
on:
  push:
    branches: [dot/mainline-ci-migration-20261124]
    paths: [.github/workflows/product-source-shadow-request.yml]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request:
    if: github.repository_id == '1343796337' && (github.ref == 'refs/heads/dot/mainline-ci-migration-20261124' || (github.event_name == 'pull_request' && github.event.pull_request.number == 26 && github.event.pull_request.head.repo.id == 1343796337 && github.event.pull_request.head.ref == 'dot/mainline-ci-migration-20261124'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Stage bounded request without checkout or cross-repository secret
        shell: python
        run: |
          import json, os, re
          from pathlib import Path

          stage = "origin"
          def need(ok):
              if not ok:
                  raise SystemExit("source shadow request refused: "+stage)

          env = os.environ
          need(env["GITHUB_REPOSITORY_ID"] == "1343796337")
          ref = "refs/heads/dot/mainline-ci-migration-20261124"
          actual_ref = env["GITHUB_REF"]
          sha = env["GITHUB_SHA"]
          need(bool(re.fullmatch(r"[0-9a-f]{40}", sha)) and sha != "0" * 40)
          run, attempt = env["GITHUB_RUN_ID"], env["GITHUB_RUN_ATTEMPT"]
          need(bool(re.fullmatch(r"[1-9][0-9]{0,19}",run)))
          need(bool(re.fullmatch(r"[1-9][0-9]{0,5}",attempt)))
          body = Path(env["GITHUB_EVENT_PATH"]).read_bytes()
          need(len(body) <= 32 * 1024 * 1024)
          payload = json.loads(body)
          need(payload.get("repository",{}).get("id") == 1343796337)
          stage = "event"
          event = env["GITHUB_EVENT_NAME"]
          before = base = merge = number = None
          head = sha
          if event == "push":
              need(actual_ref == ref and payload.get("ref") == ref and payload.get("after") == sha and payload.get("deleted") is False)
              before = payload.get("before")
              need(isinstance(before,str) and bool(re.fullmatch(r"[0-9a-f]{40}", before)))
              if before == "0"*40:
                  before = None
          elif event == "pull_request":
              stage = "pr-number-ref"
              pr = payload["pull_request"]
              number = payload["number"]
              need(type(number) is int and number == pr["number"] == 26 and actual_ref == "refs/pull/26/merge")
              stage = "pr-state"
              need(payload["action"] in ("opened", "reopened", "synchronize") and pr["state"] == "open")
              stage = "pr-repositories"
              need(pr["head"]["repo"]["id"] == pr["base"]["repo"]["id"] == 1343796337)
              need(pr["head"]["ref"] == "dot/mainline-ci-migration-20261124" and pr["base"]["ref"] == "main")
              stage = "pr-sha-shape"
              head, base, merge = pr["head"]["sha"], pr["base"]["sha"], sha
              need(all(isinstance(v,str) and re.fullmatch(r"[0-9a-f]{40}", v) and v != "0"*40 for v in (head,base)))
              # The webhook's merge_commit_sha can be stale on synchronize.
              # This metadata-only receipt is untrusted until the private
              # broker confirms the current merge ref and both parents.
          else:
              need(actual_ref == ref and event == "workflow_dispatch" and payload.get("ref") in (ref, ref.removeprefix("refs/heads/"))
                   and not payload.get("inputs"))
          record = dict(source_event_name=event, source_ref=actual_ref, source_repository_id=1343796337,
                        source_head_sha=head, source_base_sha=base, source_merge_sha=merge,
                        source_before_sha=before, source_pr_number=number, check_sha=sha, execution_sha=sha,
                        request_id=f"{run}-{attempt}")
          with (Path(env["RUNNER_TEMP"]) / "ci-request.json").open("x", encoding="ascii") as out:
              json.dump(record, out, sort_keys=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-request.json
          if-no-files-found: error
          retention-days: 3
