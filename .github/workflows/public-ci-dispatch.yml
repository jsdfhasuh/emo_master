name: Dispatcher filename witness (isolated synthetic only)
on:
  push:
    branches: [dot/dispatcher-path-witness-20261124]
permissions: {}
jobs:
  identity:
    if: >-
      github.repository_id == '1343796337' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dot/dispatcher-path-witness-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create synthetic metadata without running any product files
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          from re import fullmatch

          env = os.environ
          run, attempt = env["GITHUB_RUN_ID"], env["GITHUB_RUN_ATTEMPT"]
          commit, workflow = env["GITHUB_SHA"], env["GITHUB_WORKFLOW_SHA"]
          assert all(fullmatch(r"[1-9][0-9]*", v) for v in (run, attempt))
          assert fullmatch(r"[a-f0-9]{40}", commit) and commit == workflow
          assert env["GITHUB_REPOSITORY_ID"] == "1343796337"
          assert env["GITHUB_REF"] == "refs/heads/dot/dispatcher-path-witness-20261124"
          assert env["GITHUB_WORKFLOW_REF"] == (
              "jsdfhasuh/emo_master/.github/workflows/public-ci-dispatch.yml@" + env["GITHUB_REF"])
          data = {"synthetic_only": True, "witness_version": 1,
                  "repository_id": int(env["GITHUB_REPOSITORY_ID"]), "run_id": int(run),
                  "attempt": int(attempt), "source_event": "push", "branch_ref": env["GITHUB_REF"],
                  "workflow_path": ".github/workflows/public-ci-dispatch.yml", "workflow_sha": workflow}
          path = Path(env["RUNNER_TEMP"]) / "request.json"
          path.write_text(json.dumps(data, separators=(",", ":")), encoding="utf-8")
      - name: Upload synthetic artifact only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request.json
          if-no-files-found: error
          retention-days: 1
