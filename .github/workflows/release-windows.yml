name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate source and release version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: windows

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Configure native Windows test desktop
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Verify native Windows test desktop
        shell: python
        env:
          PYTHONPATH: src
        run: |
          import json
          import emo_master
          from PySide2.QtWidgets import QApplication
          app = QApplication([])
          screen = app.primaryScreen()
          geometry = screen.geometry()
          print(json.dumps({"platform": app.platformName(),
              "geometry": geometry.getRect(),
              "available": screen.availableGeometry().getRect(),
              "scale": screen.devicePixelRatio()}), flush=True)
          assert app.platformName() == "windows"
          assert geometry.width() >= 1920 and geometry.height() >= 1080

      - name: Validate tag matches application version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,3}([-.][A-Za-z0-9._-]+)?$') {
            throw "Release tag must look like v1.2.3, got: $env:RELEASE_TAG"
          }
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          $env:PYTHONPATH = (Resolve-Path -LiteralPath 'src').Path
          $appVersion = python -c "import emo_master; print(emo_master.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to import emo_master.__version__'
          }
          if ($tagVersion -ne $appVersion.Trim()) {
            throw "Release tag version $tagVersion does not match application version $appVersion"
          }

      - name: Run project checks and ONNX tests
        run: python scripts/ci_check.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-source-test-results
          path: |
            build/ci-results.xml
            build/ci-failures.log
          if-no-files-found: ignore

  package:
    name: Build and publish Designer and Runtime
    needs: validate
    uses: jsdfhasuh/python_build_scripts/.github/workflows/release-emo-master.yml@91766f6d18ca9a333f64cf1c6030202457ec4a8a
    with:
      packager_ref: 91766f6d18ca9a333f64cf1c6030202457ec4a8a
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
      publish_release: true
    secrets: inherit
