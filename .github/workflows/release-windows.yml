name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate source and release version
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate tag matches application version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,3}([-.][A-Za-z0-9._-]+)?$') {
            throw "Release tag must look like v1.2.3, got: $env:RELEASE_TAG"
          }
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          $env:PYTHONPATH = (Resolve-Path -LiteralPath 'src').Path
          $appVersion = python -c "import emo_master; print(emo_master.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to import emo_master.__version__'
          }
          if ($tagVersion -ne $appVersion.Trim()) {
            throw "Release tag version $tagVersion does not match application version $appVersion"
          }

      - name: Run project checks and ONNX tests
        run: python scripts/ci_check.py

  package:
    name: Build Windows package
    needs: validate
    uses: jsdfhasuh/python_build_scripts/.github/workflows/release-windows.yml@master
    with:
      target: emo-master
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
      release_repo: ${{ github.repository }}
      publish_release: false
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: windows-latest

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets

      - name: Verify artifact names and SHA256
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $portableName = "emo-master-windows-$env:RELEASE_TAG.zip"
          $setupName = "emo-master-setup-$env:RELEASE_TAG.exe"
          $manifestPath = Join-Path 'release-assets' 'manifest.json'
          $portablePath = Join-Path 'release-assets' $portableName
          $setupPath = Join-Path 'release-assets' $setupName
          foreach ($path in @($portablePath, $setupPath, $manifestPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release artifact is missing: $path"
            }
          }
          $allAssets = @(Get-ChildItem -LiteralPath 'release-assets' -File)
          if ($allAssets.Count -ne 3) {
            throw "Expected exactly three release artifacts, found $($allAssets.Count)"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $portableSha = (Get-FileHash -LiteralPath $portablePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSha = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.url -ne $manifest.assets.portable.url -or $manifest.sha256 -ne $portableSha) {
            throw 'Top-level manifest URL/SHA256 does not match the portable asset'
          }
          if ($manifest.assets.portable.name -ne $portableName -or $manifest.assets.portable.sha256 -ne $portableSha) {
            throw 'Portable asset metadata or SHA256 is invalid'
          }
          if ($manifest.assets.setup.name -ne $setupName -or $manifest.assets.setup.sha256 -ne $setupSha) {
            throw 'Setup asset metadata or SHA256 is invalid'
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          $assets = @(
            (Join-Path 'release-assets' "emo-master-windows-$env:RELEASE_TAG.zip"),
            (Join-Path 'release-assets' "emo-master-setup-$env:RELEASE_TAG.exe"),
            (Join-Path 'release-assets' 'manifest.json')
          )
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --repo $env:RELEASE_REPO --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --repo $env:RELEASE_REPO `
              --title $env:RELEASE_TAG `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $env:RELEASE_TAG"
          }
