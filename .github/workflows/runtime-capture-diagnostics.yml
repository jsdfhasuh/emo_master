name: Windows normal capture diagnostics (not acceptance)

on:
  workflow_dispatch:
  push:
    branches: [agent/runtime-workflow-architecture-v1]
    paths:
      - .github/workflows/runtime-capture-diagnostics.yml
      - scripts/r3_sqlite_capture_diagnostics.py
      - tests/test_r3_sqlite_capture_diagnostics.py

permissions:
  contents: read

concurrency:
  group: windows-capture-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: Instrumented original order / Windows / Python 3.10
    # Standard CI machine class and dependencies; original test order,
    # deadlines, worker target, SQLite durability and assertions stay intact.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the existing test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Record the hosted runner resource boundary
        shell: python
        run: |
          import ctypes, json, os
          from ctypes import wintypes
          class Memory(ctypes.Structure):
              _fields_ = [("length", wintypes.DWORD), ("load", wintypes.DWORD)] + [
                  (name, ctypes.c_ulonglong) for name in (
                      "total_physical", "available_physical", "total_commit",
                      "available_commit", "total_virtual", "available_virtual", "extended_virtual")]
          kernel = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel.GlobalMemoryStatusEx.argtypes = [ctypes.POINTER(Memory)]
          kernel.GlobalMemoryStatusEx.restype = wintypes.BOOL
          memory = Memory()
          memory.length = ctypes.sizeof(memory)
          if not kernel.GlobalMemoryStatusEx(ctypes.byref(memory)):
              raise ctypes.WinError(ctypes.get_last_error())
          print(json.dumps({"role": "diagnostic_only", "runner": "windows-latest standard",
              "job_timeout_minutes": 30, "cpu_count": os.cpu_count(),
              **{name: getattr(memory, name) for name in (
                  "total_physical", "available_physical", "total_commit", "available_commit")}}))
      - name: Run original pytest order with the exact normal capture observer
        id: observed_tests
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'runtime-capture-diagnostics.json'
          python -m pytest -q -p scripts.r3_sqlite_capture_diagnostics --sqlite-capture-diagnostics $evidence
          exit $LASTEXITCODE
      - name: Print bounded synthetic evidence to this job log
        if: always()
        shell: python
        env:
          ORIGINAL_TEST_STEP: ${{ steps.observed_tests.outcome }}
        run: |
          import json, os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "runtime-capture-diagnostics.json"
          if not evidence.is_file() or not 0 < evidence.stat().st_size <= 1024 * 1024:
              raise RuntimeError("CAPTURE_DIAGNOSTIC_UNAVAILABLE: missing, empty or oversized; do not infer PASS")
          content = evidence.read_text(encoding="utf-8")
          print("CAPTURE_DIAGNOSTIC_JSON_BEGIN")
          print(content)
          print("CAPTURE_DIAGNOSTIC_JSON_END")
          record = json.loads(content)
          source = record.get("source", {})
          target = "tests/runtime/presentation/test_normal_capture.py::testOriginalStartCapturesInstalledOperatorsAndProductionCounter"
          valid = (source.get("test") == target
              and source.get("diagnostic_valid") is True
              and source.get("source_stable") is True
              and source.get("runtime_bound") is True
              and source.get("fixture_teardown_outcome") in ("passed", "failed")
              and record.get("observer_retired") is True
              and record.get("worker_instrumented") is False
              and record.get("errors") == []
              and source.get("pytest_outcome") in ("passed", "failed"))
          if os.environ.get("ORIGINAL_TEST_STEP") == "success":
              valid = (valid and source.get("pytest_outcome") == "passed"
                  and source.get("fixture_teardown_outcome") == "passed")
          if not valid:
              raise RuntimeError("CAPTURE_DIAGNOSTIC_INVALID: missing, changed or unfinished observations")
