name: Windows export credit diagnostics (not acceptance)

on:
  workflow_dispatch:
  push:
    branches: [agent/runtime-workflow-architecture-v1]
    paths:
      - .github/workflows/runtime-credit-diagnostics.yml
      - scripts/r3_export_credit_report.py
      - scripts/r3_hosted_credit_guard.py
      - scripts/r3_export_credit_control.py
      - scripts/r3_export_credit_trace.py
      - scripts/r3_capture_credit_trace.py
      - scripts/r3_policy_measure.py
      - scripts/r3_measure.py
      - scripts/r3_asset_split_trace.py
      - scripts/r3_asset_split_analyze.py
      - tests/test_r3_export_credit_report.py
      - tests/test_r3_hosted_credit_guard.py
      - tests/runtime/presentation/test_r3_export_credit_control.py
      - tests/runtime/presentation/test_r3_export_credit_trace.py
      - tests/runtime/presentation/test_r3_capture_credit_trace.py
      - src/emo_master/apps/runtime/presentation/**

permissions:
  contents: read

concurrency:
  group: windows-credit-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/agent/runtime-workflow-architecture-v1'
    name: Native Qt / ABBA credit observer / Windows / Python 3.10
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: windows
      HUARAY_CAMERA_SMOKE: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the existing test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Record the standard hosted resource boundary
        shell: python
        run: |
          import ctypes, json, os
          from ctypes import wintypes
          class Memory(ctypes.Structure):
              _fields_ = [("length", wintypes.DWORD), ("load", wintypes.DWORD)] + [
                  (name, ctypes.c_ulonglong) for name in (
                      "total_physical", "available_physical", "total_commit",
                      "available_commit", "total_virtual", "available_virtual", "extended_virtual")]
          kernel = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel.GlobalMemoryStatusEx.argtypes = [ctypes.POINTER(Memory)]
          kernel.GlobalMemoryStatusEx.restype = wintypes.BOOL
          memory = Memory()
          memory.length = ctypes.sizeof(memory)
          if not kernel.GlobalMemoryStatusEx(ctypes.byref(memory)):
              raise ctypes.WinError(ctypes.get_last_error())
          print(json.dumps({"role": "diagnostic_only", "runner": "windows-latest standard",
              "job_timeout_minutes": 20, "qt_platform_requested": "windows",
              "cpu_count": os.cpu_count(), **{name: getattr(memory, name) for name in (
                  "total_physical", "available_physical", "total_commit", "available_commit")}}))
      - name: Run one bounded synthetic credit ABBA control
        id: credit_control
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('export-credit-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          python scripts/r3_hosted_credit_guard.py --output $evidence
          exit $LASTEXITCODE
      - name: Always print the complete bounded diagnostic report
        if: always()
        shell: pwsh
        env:
          ORIGINAL_CONTROL_STEP: ${{ steps.credit_control.outcome }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP ('export-credit-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          python scripts/r3_export_credit_report.py --evidence $evidence --expected-sha $env:GITHUB_SHA --original-step $env:ORIGINAL_CONTROL_STEP
          exit $LASTEXITCODE
