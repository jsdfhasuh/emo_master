name: Emit isolated native Credit receipt (not production route)
on:
  workflow_dispatch:
permissions: {}
jobs:
  receipt:
    if: github.repository_id == '1343796337' && github.ref == 'refs/heads/dot/credit-native-receipt-20261127' && github.actor_id == '49879362' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Write a bounded nonsecret receipt
        shell: python
        run: |
          import json, os
          from pathlib import Path
          items = {k: os.environ["GITHUB_"+v] for k,v in {"event":"EVENT_NAME","ref":"REF","head":"SHA",
              "run":"RUN_ID","attempt":"RUN_ATTEMPT","repository_id":"REPOSITORY_ID"}.items()}
          items["scope"] = "isolated-credit-native-proof"
          (Path(os.environ["RUNNER_TEMP"])/"credit-native-request.json").write_text(
              json.dumps(items,sort_keys=True,separators=(",",":"))+"\n", encoding="ascii")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: credit-native-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/credit-native-request.json
          if-no-files-found: error
          retention-days: 3
