name: Emit one exact diagnostic rehearsal receipt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emit:
    if: >-
      github.repository_id == '1343796337' &&
      github.ref == 'refs/heads/dot/runtime-native-origin-20261127' &&
      github.actor_id == '49879362' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci_cutover
      - run: python3 -I scripts/ci_cutover/request_emitter.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-request.json
          if-no-files-found: error
          retention-days: 3
