name: Synthetic Thread Pool provider validation

on:
  push:
    branches: [codex/ci-threadpool-provider-smoke]
    paths:
      - scripts/r3_threadpool_provider_smoke.py
      - .github/workflows/runtime-threadpool-provider-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    if: github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install existing observer import dependency
        run: python -m pip install pytest
      - name: Capture one synthetic Win32 callback and validate its actual ETW fields
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "threadpool-smoke-$env:GITHUB_RUN_ID"
          python -m scripts.r3_threadpool_provider_smoke --capture $out
          exit $LASTEXITCODE
      - name: Preserve diagnostic evidence independently of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threadpool-provider-smoke
          path: ${{ runner.temp }}/threadpool-smoke-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7
