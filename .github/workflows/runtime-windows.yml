name: Build Operator Runtime

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag or commit containing the operator Runtime
        required: true
        type: string
      packager_ref:
        description: Packager commit containing configs/emo-master-runtime.json
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.sha }}
      packager_sha: ${{ steps.version.outputs.packager_sha }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Resolve the requested packager checkout
        uses: actions/checkout@v7
        with:
          repository: jsdfhasuh/python_build_scripts
          ref: ${{ inputs.packager_ref }}
          path: .runtime-packager
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Resolve source identity
        id: version
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path src).Path
          $version = python -c "import emo_master; print(emo_master.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read source version' }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve source SHA' }
          $packagerSha = git -C .runtime-packager rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve packager SHA' }
          New-Item -ItemType Directory -Path runtime-evidence -Force | Out-Null
          [ordered]@{source_commit = $sha.Trim(); packager_commit = $packagerSha.Trim();
            published = $false; fieldAcceptance = 'NOT_RUN'} |
            ConvertTo-Json | Set-Content -LiteralPath runtime-evidence/checkouts.json -Encoding utf8
          Add-Content $env:GITHUB_OUTPUT "tag=v$($version.Trim())"
          Add-Content $env:GITHUB_OUTPUT "sha=$sha"
          Add-Content $env:GITHUB_OUTPUT "packager_sha=$($packagerSha.Trim())"
      - name: Runtime source regression
        shell: pwsh
        run: ./scripts/validate_runtime_source.ps1
      - name: Upload Runtime source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: operator-runtime-source-evidence
          path: runtime-evidence/**
          if-no-files-found: warn
  package:
    needs: validate
    uses: jsdfhasuh/python_build_scripts/.github/workflows/release-windows.yml@29b375fcd368b1f88be14b3356fe182b8e4e02e0
    with:
      target: emo-master-runtime
      source_ref: ${{ needs.validate.outputs.source_sha }}
      packager_ref: ${{ needs.validate.outputs.packager_sha }}
      release_tag: ${{ needs.validate.outputs.release_tag }}
      release_repo: ${{ github.repository }}
      publish_release: false
    secrets: inherit
  verify_archive:
    needs: [validate, package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets
      - name: Verify extracted portable Runtime
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          PACKAGER_SHA: ${{ needs.validate.outputs.packager_sha }}
        run: |
          ./scripts/verify_runtime_artifacts.ps1 -ArtifactDirectory release-assets `
            -ReleaseTag $env:RELEASE_TAG -SourceCommit $env:SOURCE_SHA -PackagerCommit $env:PACKAGER_SHA
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: operator-runtime-archive-acceptance
          path: release-assets/archive-check/**
          if-no-files-found: warn
