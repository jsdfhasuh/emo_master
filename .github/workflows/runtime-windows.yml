name: Build Operator Runtime (native receipt only on rehearsal branch)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact approved source commit containing the operator Runtime
        required: true
        type: string
      packager_ref:
        description: Exact reviewed packager commit for this rehearsal
        required: true
        default: e0204fe6fe83b0f31818d88e4f296c70e230d172
        type: string
permissions:
  contents: read
jobs:
  native-receipt:
    if: >-
      github.repository_id == '1343796337' &&
      github.ref == 'refs/heads/dot/runtime-buildonly-origin-20261127' &&
      inputs.source_ref == '348a39f42a5f8d43d3319a894857db9e9e6ce059' &&
      inputs.packager_ref == 'e0204fe6fe83b0f31818d88e4f296c70e230d172'
    uses: ./.github/workflows/emit-ci-cutover-request.yml
