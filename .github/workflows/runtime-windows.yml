name: Release Source Validation (native manual receipt only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-receipt:
    if: >-
      github.repository_id == '1343796337' &&
      github.actor_id == '49879362' &&
      github.run_attempt == '1' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/dot/release-source-manual-origin-20261127'
    uses: ./.github/workflows/emit-ci-cutover-request.yml
