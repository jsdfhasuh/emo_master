name: Validate frozen Windows package (no release)

on:
  pull_request:
    branches: [agent/runtime-workflow-architecture-v1, main]
    paths:
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/validate-windows-package.yml'
      - 'scripts/verify_frozen_runtime.py'
      - 'scripts/verify_windows_package.ps1'
      - 'tests/test_release_workflow_contract.py'
      - 'tests/test_frozen_runtime_validation.py'
  workflow_dispatch:

# The reused legacy build job declares write permission, but publication is
# hard-disabled below. This workflow never creates tags or releases.
permissions:
  contents: write

concurrency:
  group: frozen-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      release_tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Read exact source identity without importing the application
        id: source
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $version = python -c "import ast,pathlib; t=ast.parse(pathlib.Path('src/emo_master/__init__.py').read_text()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='__version__' for x in n.targets)))"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+(\.\d+){1,3}$') { throw 'Invalid application version' }
          Add-Content $env:GITHUB_OUTPUT "sha=$sha"
          Add-Content $env:GITHUB_OUTPUT "tag=v$version"

  package:
    needs: prepare
    uses: jsdfhasuh/python_build_scripts/.github/workflows/release-windows.yml@d5f3617a7265c545c793366f93e3a114212d8c59
    with:
      target: emo-master
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      release_repo: jsdfhasuh/emo_master
      packager_ref: d5f3617a7265c545c793366f93e3a114212d8c59
      publish_release: false

  verify:
    needs: [prepare, package]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      HUARAY_CAMERA_SMOKE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets
      - name: Install validation clients and test tools
        run: python -m pip install -r requirements-dev.txt psutil pywinauto Pillow
      - name: Verify desktop test dependencies
        run: python -c "from PIL import ImageGrab; import psutil, pywinauto; print('Desktop test dependencies available')"
      - name: Check workflow and frozen-validation contracts
        run: python -m pytest tests/test_release_workflow_contract.py tests/test_frozen_runtime_validation.py -q
      - name: Verify frozen GUI, Runtime and artifact provenance
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $env:PYTHONPATH = (Resolve-Path src).Path
          python scripts/verify_frozen_runtime.py --artifact-directory release-assets --output evidence/frozen-validation.json --expected-source-sha $env:EXPECTED_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Windows package validation failed' }
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emo-master-frozen-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            !evidence/frozen-validation/product/**
          if-no-files-found: warn
