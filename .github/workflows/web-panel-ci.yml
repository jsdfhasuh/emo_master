name: Web panel isolated checks
on:
  push:
    branches: [main, codex/logging-and-designer-improvements]
    paths: ['web_panel/**', 'src/**', 'proto/**', 'requirements*.txt', '.github/workflows/web-panel-ci.yml']
  pull_request:
    branches: [main]
    paths: ['web_panel/**', 'src/**', 'proto/**', 'requirements*.txt', '.github/workflows/web-panel-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  web-panel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Pure JS/state-fixture regressions run once per change. Windows retains
      # native-path/Python harnesses, HTTP/WS, dialogs, geometry, file/CLI and wheel.
      # Manual runs deliberately exercise the full suite on both platforms.
      FULL_WEB_LOGIC: ${{ matrix.os == 'ubuntu-latest' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: web_panel
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Report Web test coverage
        run: |
          if [[ "$FULL_WEB_LOGIC" == 'true' ]]; then
            echo 'Full Web suite: backend, frontend logic, all browser checks in this workflow and independent wheel.' >> "$GITHUB_STEP_SUMMARY"
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Windows platform checks: full backend tests, frontend build, native-path React harness, Node-to-Python AST checks, desktop/mobile browser entry, native confirmation, geometry, real HTTP/WS, editor file operations, local authentication, preview CLI and independent wheel.

          Frontend unit coverage here runs both complete editor_draft_recovery.test.mjs and editor_round3.test.mjs files.

          The full frontend unit suite and the catalog refresh, draft recovery and Dispatch route-fixture browser scripts are not run in this Windows job. They run in the Linux job on every change; workflow_dispatch runs them on both platforms.
          SUMMARY
          fi
      - name: Install only isolated Web dependencies
        run: python -m pip install contracts/panel-contract-v1/python/*.whl && python -m pip install -e '.[test]' build playwright
      - name: Verify delivered official SDK version
        run: python -c "from importlib.metadata import version; assert version('emo-panel-protocol') == '1.5.0'"
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend logic regressions
        if: env.FULL_WEB_LOGIC == 'true'
        run: npm --prefix frontend test
      - name: Frontend platform regressions
        if: env.FULL_WEB_LOGIC == 'false'
        run: node --test frontend/tests/editor_draft_recovery.test.mjs frontend/tests/editor_round3.test.mjs
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Install test browser
        # These checks use the default headless shell and no media playback.
        # Keep Linux libraries; avoid installing unused Windows media features.
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            python -m playwright install --with-deps --only-shell chromium
          else
            python -m playwright install --only-shell chromium
          fi
      - name: Package UI and draft fixture
        run: python scripts/package_frontend.py && python dev/fixtures/make_demo_package.py
      - name: Browser fixture checks
        run: python frontend/tests/browser_smoke.py
      - name: Stop confirmation and retired image identity browser regression
        run: python frontend/tests/asset_retirement_browser.py
      - name: Shared spacer and expanded canvas browser checks
        run: python frontend/tests/spacer_browser.py
      - name: Current-target catalog refresh browser checks
        if: env.FULL_WEB_LOGIC == 'true'
        run: python frontend/tests/catalog_refresh_e2e.py
      - name: Editor draft recovery browser checks
        if: env.FULL_WEB_LOGIC == 'true'
        run: python frontend/tests/editor_draft_recovery_browser.py
      - name: Browser harness checks
        run: python -m unittest discover -s frontend/tests -p 'test_browser_harness.py' -v
      - name: Editor Dispatch capture isolation browser checks
        if: env.FULL_WEB_LOGIC == 'true'
        run: python frontend/tests/editor_dispatch_browser.py
      - name: Editor package and grid browser checks
        run: python frontend/tests/editor_package_browser.py
      - name: Browser full Web application checks
        run: python frontend/tests/backend_e2e.py
      - name: Opt-in local passwordless browser checks (synthetic Runtime)
        run: python frontend/tests/local_no_auth_e2e.py
      - name: Official preview CLI and browser contract checks
        run: python frontend/tests/official_e2e.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            web_panel/frontend/test-tmp/*.png
            web_panel/frontend/test-tmp/*.html
            web_panel/frontend/test-tmp/spacer-browser/
            web_panel/frontend/*-mobile.png
            web_panel/frontend/*-desktop.png
            web_panel/test-results/asset-retirement-browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build independent distribution
        run: python -m build --wheel
      - name: Verify distribution includes UI and does not import Qt
        run: |
          python - <<'PY'
          import sys, zipfile
          from pathlib import Path
          import emo_web_panel
          assert 'PySide2' not in sys.modules and 'emo_master' not in sys.modules
          wheel=next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as z:
              assert 'emo_web_panel/static/index.html' in z.namelist()
          PY
      - name: Install wheel outside source checkout
        run: python scripts/verify_wheel.py
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: web-panel-development-preview-${{ matrix.os }}-${{ github.sha }}
          path: |
            web_panel/dist/*.whl
            web_panel/contracts/panel-contract-v1/python/*.whl
            web_panel/docs/
            web_panel/README.md
            web_panel/dev/fixtures/demo.emoweb
          retention-days: 7
  product-runtime:
    name: Owning Runtime integration (synthetic data, Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      EMO_WEB_PRODUCT_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install owning Runtime dependencies in separate test environment
        run: python -m pip install -r requirements.txt
      - name: Install independent gateway and supplied SDK for contract tests
        shell: bash
        run: python -m pip install web_panel/contracts/panel-contract-v1/python/*.whl './web_panel[test]'
      - name: Verify delivered official SDK version
        run: python -c "from importlib.metadata import version; assert version('emo-panel-protocol') == '1.5.0'"
      - name: Actual software Runtime via loopback (no devices)
        run: python -m unittest discover -s web_panel/tests -p test_product_runtime.py -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build Web UI for combined software Runtime browser acceptance
        shell: bash
        run: npm --prefix web_panel/frontend ci && npm --prefix web_panel/frontend run build && python web_panel/scripts/package_frontend.py
      - name: Install browser for combined software Runtime acceptance
        run: python -m pip install playwright && python -m playwright install --only-shell chromium
      - name: Required SDK 1.5.0 same-Runtime two-Job image and automatic restart acceptance
        run: python web_panel/frontend/tests/product_runtime_e2e.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-runtime-evidence-${{ github.sha }}
          path: |
            web_panel/test-results/product-runtime/
            web_panel/test-results/product-browser/
          if-no-files-found: ignore
          retention-days: 7
