<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>emo_master 日志工作台 · 可用性修订交互原型</title>
<style>html,body{margin:0;padding:0;background:#eef1f6;color-scheme:light dark}body{max-width:1440px;margin:auto;padding:20px;font-family:"Microsoft YaHei UI","Noto Sans CJK SC",system-ui,sans-serif}button.cursor-interaction,summary.cursor-interaction{cursor:pointer}button:disabled{cursor:default}@media(max-width:560px){body{padding:0}}</style>
</head>
<body>
<div id="emo-log-usability-review">
  <div class="em-shell" aria-label="emo_master 日志交互原型"></div>
  <div class="em-live" aria-live="polite"></div>
</div>
<style>
#emo-log-usability-review{--em-bg:light-dark(#f5f6f8,#181c23);--em-panel:light-dark(#fff,#222731);--em-text:light-dark(#20242b,#e6e9ee);--em-muted:light-dark(#626b78,#aeb7c5);--em-border:light-dark(#d8dce3,#3d4654);--em-hover:light-dark(#f1f4f9,#2b3340);--em-accent:light-dark(#2563eb,#88adff);--em-tint:light-dark(#edf3ff,#293b5c);--em-green:light-dark(#247452,#8bd6b5);--em-green-bg:light-dark(#edf8f2,#253b33);--em-warn:light-dark(#91600b,#f2c77d);--em-warn-bg:light-dark(#fff7e6,#453822);--em-red:light-dark(#c43838,#ffaaa5);--em-red-bg:light-dark(#fff0ee,#472e32);font-family:"Microsoft YaHei UI","Noto Sans CJK SC",system-ui,sans-serif;color:var(--em-text);font-size:13px;line-height:1.5;width:100%;position:relative;color-scheme:light dark}
#emo-log-usability-review *{box-sizing:border-box}
#emo-log-usability-review button,#emo-log-usability-review input,#emo-log-usability-review select,#emo-log-usability-review textarea{font:inherit;color:inherit}
#emo-log-usability-review button{border:1px solid var(--em-border);background:var(--em-panel);border-radius:5px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:32px;max-width:100%;text-align:left}
#emo-log-usability-review button:hover{background:var(--em-hover)}
#emo-log-usability-review button:disabled{opacity:.45;cursor:default}
#emo-log-usability-review input,#emo-log-usability-review select,#emo-log-usability-review textarea{background:var(--em-panel);border:1px solid var(--em-border);border-radius:5px;min-width:0;max-width:100%;padding:6px 8px;width:100%;min-height:32px}
#emo-log-usability-review input[type=checkbox]{width:15px;min-height:15px;accent-color:var(--em-accent)}
#emo-log-usability-review h1,#emo-log-usability-review h2,#emo-log-usability-review h3,#emo-log-usability-review p{margin:0}
#emo-log-usability-review h1{font-size:22px;font-weight:600;line-height:1.4}
#emo-log-usability-review h2{font-size:16px;font-weight:600}
#emo-log-usability-review h3{font-size:14px;font-weight:600}
#emo-log-usability-review small{font-size:12px}
#emo-log-usability-review code,#emo-log-usability-review .em-mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
#emo-log-usability-review .em-shell{background:var(--em-panel);border:1px solid var(--em-border);min-width:0}
#emo-log-usability-review .em-chrome{background:var(--em-bg);border-bottom:1px solid var(--em-border);min-height:49px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 104px 10px 18px}
#emo-log-usability-review .em-logo{background:var(--em-accent);color:var(--em-panel);width:25px;height:25px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
#emo-log-usability-review .em-brand{font-weight:650;letter-spacing:.2px}
#emo-log-usability-review .em-separator{height:18px;border-left:1px solid var(--em-border)}
#emo-log-usability-review .em-demo{margin-left:auto;color:var(--em-muted);font-size:11px;white-space:normal}
#emo-log-usability-review .em-page{padding:15px 18px 0}
#emo-log-usability-review .em-crumb{display:flex;align-items:center;flex-wrap:wrap;gap:10px;color:var(--em-muted);font-size:12px;margin-bottom:13px}
#emo-log-usability-review .em-quiet{border-color:transparent;background:transparent;padding:4px 5px;color:var(--em-muted);min-height:28px}
#emo-log-usability-review .em-link{border-color:transparent;background:transparent;color:var(--em-accent);padding:3px 5px}
#emo-log-usability-review .em-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
#emo-log-usability-review .em-sub{color:var(--em-muted);font-size:12px;margin-top:4px}
#emo-log-usability-review .em-badge{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-radius:4px;font-size:11px;padding:2px 7px;background:var(--em-bg);color:var(--em-muted);font-weight:400}
#emo-log-usability-review .em-badge.run{background:var(--em-tint);color:var(--em-accent)}
#emo-log-usability-review .em-badge.good{background:var(--em-green-bg);color:var(--em-green)}
#emo-log-usability-review .em-badge.warn{background:var(--em-warn-bg);color:var(--em-warn)}
#emo-log-usability-review .em-badge.bad{background:var(--em-red-bg);color:var(--em-red)}
#emo-log-usability-review .em-tabs{display:flex;gap:23px;border-bottom:1px solid var(--em-border);margin-bottom:16px}
#emo-log-usability-review .em-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;padding:8px 2px 11px;color:var(--em-muted)}
#emo-log-usability-review .em-tabs button.is-active{color:var(--em-accent);border-bottom-color:var(--em-accent);font-weight:600}
#emo-log-usability-review .em-topline{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#emo-log-usability-review .em-segment{display:inline-flex;background:var(--em-bg);padding:3px;border-radius:6px;border:1px solid var(--em-border);gap:3px;max-width:100%}
#emo-log-usability-review .em-segment button{border:0;border-radius:4px;min-height:29px;padding:4px 10px;color:var(--em-muted);background:transparent;font-size:12px;white-space:nowrap}
#emo-log-usability-review .em-segment button.is-active{background:var(--em-panel);color:var(--em-accent);box-shadow:0 1px 3px light-dark(#1e293b14,#0003)}
#emo-log-usability-review .em-follow{display:inline-flex;align-items:center;gap:6px;color:var(--em-muted);font-size:12px}
#emo-log-usability-review .em-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
#emo-log-usability-review .em-search{flex:1 1 220px;min-width:120px}
#emo-log-usability-review .em-levels{display:flex;gap:3px;flex-wrap:wrap}
#emo-log-usability-review .em-levels button{padding:5px 7px;min-height:31px;font-size:11px;border-color:transparent}
#emo-log-usability-review button.em-active{color:var(--em-accent);background:var(--em-tint);border-color:var(--em-accent)}
#emo-log-usability-review .em-filterbox{background:var(--em-bg);border:1px solid var(--em-border);border-radius:6px;padding:12px;margin-bottom:12px}
#emo-log-usability-review .em-filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 12px}
#emo-log-usability-review .em-field{display:flex;flex-direction:column;gap:5px;min-width:0;color:var(--em-muted);font-size:11px}
#emo-log-usability-review .em-field select,#emo-log-usability-review .em-field input{color:var(--em-text);font-size:12px}
#emo-log-usability-review .em-filter-note{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--em-muted);margin-top:9px}
#emo-log-usability-review .em-error{color:var(--em-red);font-size:12px;margin-top:8px}
#emo-log-usability-review .em-activefilters{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 10px;color:var(--em-muted);font-size:12px}
#emo-log-usability-review .em-chip{font-size:11px;padding:2px 6px;min-height:24px;color:var(--em-accent);border-color:var(--em-border);background:var(--em-tint)}
#emo-log-usability-review .em-workspace{position:relative;display:grid;grid-template-columns:minmax(0,1fr);align-items:start;margin:0 -18px}
#emo-log-usability-review .em-workspace.has-drawer{grid-template-columns:minmax(0,1fr) 322px}
#emo-log-usability-review .em-listpane{min-width:0}
#emo-log-usability-review .em-resultbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;background:var(--em-bg);border-top:1px solid var(--em-border);border-bottom:1px solid var(--em-border);padding:6px 14px;color:var(--em-muted);font-size:11px;min-height:39px}
#emo-log-usability-review .em-resultbar .em-actions{display:flex;gap:2px;flex-wrap:wrap}
#emo-log-usability-review .em-resultbar button{font-size:11px;min-height:25px;padding:2px 5px}
#emo-log-usability-review .em-tree{margin:0;padding:7px 11px 11px;list-style:none}
#emo-log-usability-review .em-tree ul{list-style:none;margin:0 0 0 11px;padding:0 0 0 11px;border-left:1px solid var(--em-border)}
#emo-log-usability-review .em-tree li{margin:0;padding:0}
#emo-log-usability-review .em-branch{display:flex;align-items:center;gap:7px;min-height:37px;padding:4px 4px;border-bottom:1px solid light-dark(#eef0f4,#303744);flex-wrap:wrap}
#emo-log-usability-review .em-branch.is-current{background:var(--em-tint);border-radius:4px}
#emo-log-usability-review .em-treetoggle{border:0;background:transparent;justify-content:flex-start;padding:3px 0;flex:1;min-width:0;gap:7px;min-height:28px}
#emo-log-usability-review .em-treetoggle:hover{background:transparent}
#emo-log-usability-review .em-chevron{width:12px;flex:none;display:inline-block;color:var(--em-muted);font-size:16px;line-height:1}
#emo-log-usability-review .em-kind{font-size:11px;color:var(--em-muted);background:var(--em-bg);border:1px solid var(--em-border);padding:0 4px;line-height:17px;white-space:nowrap;flex:none}
#emo-log-usability-review .em-branchname{overflow-wrap:anywhere;min-width:0;font-weight:500}
#emo-log-usability-review .em-branchmeta{font-size:11px;color:var(--em-muted);display:inline-flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:none}
#emo-log-usability-review .em-branchmeta .em-time{font-variant-numeric:tabular-nums}
#emo-log-usability-review .em-count{font-size:11px;color:var(--em-muted);white-space:nowrap}
#emo-log-usability-review .em-event{display:grid;grid-template-columns:77px 44px minmax(0,1fr) 12px;align-items:start;width:100%;border:0;border-bottom:1px solid light-dark(#eef0f4,#303744);border-radius:0;background:transparent;padding:7px 5px;gap:6px;min-height:34px;text-align:left;font-size:12px}
#emo-log-usability-review .em-event.is-selected{background:var(--em-tint);box-shadow:inset 3px 0 var(--em-accent)}
#emo-log-usability-review .em-eventtime{font-size:11px;font-variant-numeric:tabular-nums;color:var(--em-muted);padding-top:2px}
#emo-log-usability-review .em-level{font-size:11px;line-height:19px;text-align:center;border-radius:3px;color:var(--em-accent);background:var(--em-tint)}
#emo-log-usability-review .em-level.WARN{color:var(--em-warn);background:var(--em-warn-bg)}
#emo-log-usability-review .em-level.ERROR{color:var(--em-red);background:var(--em-red-bg)}
#emo-log-usability-review .em-level.DEBUG{color:var(--em-muted);background:var(--em-bg)}
#emo-log-usability-review .em-eventmessage{overflow-wrap:anywhere;min-width:0}
#emo-log-usability-review .em-eventpath{font-size:11px;color:var(--em-muted);margin-top:2px}
#emo-log-usability-review .em-flat{padding:0 13px 10px}
#emo-log-usability-review .em-empty{text-align:center;color:var(--em-muted);padding:35px 16px;line-height:2}
#emo-log-usability-review .em-foot{border-top:1px solid var(--em-border);padding:9px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--em-muted);font-size:11px}
#emo-log-usability-review .em-pending{background:var(--em-tint);color:var(--em-accent);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;font-size:12px;border-bottom:1px solid var(--em-border)}
#emo-log-usability-review .em-drawer{background:var(--em-panel);border-left:1px solid var(--em-border);box-shadow:-6px 0 16px light-dark(#1e293b09,#0002);position:sticky;top:0;align-self:start;min-width:0;z-index:5}
#emo-log-usability-review .em-drawerhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--em-border);border-bottom:1px solid var(--em-border);background:var(--em-bg)}
#emo-log-usability-review .em-drawerbody{padding:14px}
#emo-log-usability-review .em-eventtitle{font-size:15px;line-height:1.6;overflow-wrap:anywhere;margin:10px 0!important}
#emo-log-usability-review .em-path{background:var(--em-bg);font-size:11px;color:var(--em-muted);padding:8px;line-height:1.8;border-radius:4px;overflow-wrap:anywhere;margin:10px 0}
#emo-log-usability-review .em-kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px 6px;font-size:11px;margin:13px 0}
#emo-log-usability-review .em-kv dt{color:var(--em-muted)}
#emo-log-usability-review .em-kv dd{margin:0;overflow-wrap:anywhere}
#emo-log-usability-review .em-drawernav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--em-border);padding:10px 14px}
#emo-log-usability-review .em-json{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.65;background:var(--em-bg);border-radius:5px;padding:10px;margin:12px 0 0;font-family:ui-monospace,Consolas,monospace}
#emo-log-usability-review .em-copyfallback{font-family:ui-monospace,Consolas,monospace;font-size:11px;min-height:150px;resize:vertical;margin-top:8px}
#emo-log-usability-review .em-notice{background:var(--em-warn-bg);color:var(--em-warn);border-radius:4px;font-size:11px;padding:7px 8px;margin:10px 0}
#emo-log-usability-review .em-mask{display:none}
#emo-log-usability-review .em-overview{padding:0 0 24px}
#emo-log-usability-review .em-overviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin:12px 0 20px}
#emo-log-usability-review .em-overviewitem{padding:12px 0;border-bottom:1px solid var(--em-border);min-width:0}
#emo-log-usability-review .em-overviewitem small{display:block;color:var(--em-muted);font-size:11px;margin-bottom:5px}
#emo-log-usability-review .em-overviewitem div{overflow-wrap:anywhere}
#emo-log-usability-review .em-section{margin:18px 0 24px}
#emo-log-usability-review .em-sectiontitle{display:flex;align-items:center;gap:8px;margin-bottom:9px}
#emo-log-usability-review .em-taskrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 82px 80px;gap:12px;align-items:center;padding:13px 8px;border-top:1px solid var(--em-border)}
#emo-log-usability-review .em-taskrow strong{font-weight:500}
#emo-log-usability-review .em-taskrow .em-sub{font-size:11px}
#emo-log-usability-review .em-related{padding:0 8px 10px}
#emo-log-usability-review .em-related-list{margin:6px 0 0;padding:8px 12px;background:var(--em-bg);border-radius:5px}
#emo-log-usability-review .em-related-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 0}
#emo-log-usability-review .em-related-row>span:first-child{flex:1;min-width:130px}
#emo-log-usability-review .em-related-note{color:var(--em-muted);font-size:12px;padding-top:6px}
#emo-log-usability-review .em-detail-related{margin:0 0 12px}
#emo-log-usability-review .em-parent-link{margin:0 0 8px}
#emo-log-usability-review .em-technical-controls{border-top:1px solid var(--em-border);padding-top:8px;margin-top:10px}
#emo-log-usability-review .em-technical-controls>.em-filters{margin-top:8px}
#emo-log-usability-review .em-homefooter{color:var(--em-muted);font-size:11px;border-top:1px solid var(--em-border);padding:10px 0}
#emo-log-usability-review .em-live{font-size:11px;color:var(--em-muted);padding:5px 1px;min-height:25px}
#emo-log-usability-review .em-primary{color:var(--em-accent);border-color:var(--em-accent);background:var(--em-tint)}
@media(max-width:899px){#emo-log-usability-review .em-workspace.has-drawer{grid-template-columns:minmax(0,1fr)}#emo-log-usability-review .em-drawer{position:absolute;top:0;right:0;width:min(360px,100%);min-height:100%;box-shadow:-14px 0 24px light-dark(#17223820,#0006)}#emo-log-usability-review .em-mask{display:block;position:absolute;inset:0;z-index:4;background:light-dark(#1722381f,#0006);border:0;border-radius:0;width:100%;height:100%;padding:0}#emo-log-usability-review .em-filters{grid-template-columns:repeat(3,minmax(0,1fr))}#emo-log-usability-review .em-demo{margin-left:0}#emo-log-usability-review .em-branchmeta .em-time{display:none}}
@media(max-width:560px){#emo-log-usability-review .em-page{padding:13px 11px 0}#emo-log-usability-review .em-workspace{margin:0 -11px}#emo-log-usability-review .em-chrome{padding-left:12px;padding-right:12px;gap:8px}#emo-log-usability-review .em-demo{width:100%;font-size:11px}#emo-log-usability-review .em-filters{grid-template-columns:repeat(2,minmax(0,1fr))}#emo-log-usability-review .em-field:last-child{grid-column:auto}#emo-log-usability-review .em-topline{align-items:flex-start}#emo-log-usability-review .em-tree{padding-left:5px;padding-right:5px}#emo-log-usability-review .em-tree ul{margin-left:4px;padding-left:6px}#emo-log-usability-review .em-branch{flex-wrap:wrap;gap:2px}#emo-log-usability-review .em-branchmeta{font-size:11px;gap:5px;margin-left:19px}#emo-log-usability-review .em-treetoggle{flex-basis:100%;font-size:12px}#emo-log-usability-review .em-event{grid-template-columns:64px 38px minmax(0,1fr) 8px;gap:3px;padding-left:2px;padding-right:2px;font-size:11px}#emo-log-usability-review .em-eventtime{font-size:11px}#emo-log-usability-review .em-count{font-size:11px}#emo-log-usability-review .em-taskrow{grid-template-columns:minmax(0,1fr) 75px;gap:8px}#emo-log-usability-review .em-taskrow .em-taskmode{display:none}#emo-log-usability-review .em-taskrow>button{grid-column:2;grid-row:auto}#emo-log-usability-review .em-overviewgrid{grid-template-columns:1fr}#emo-log-usability-review .em-levels{order:3;width:100%}#emo-log-usability-review .em-kind{font-size:11px}#emo-log-usability-review .em-segment button{padding:4px 6px}#emo-log-usability-review .em-title{align-items:flex-start}}

@media(max-width:899px){#emo-log-usability-review .em-workspace.has-drawer>.em-listpane,#emo-log-usability-review .em-workspace.has-drawer>.em-drawer{grid-column:1;grid-row:1}#emo-log-usability-review .em-workspace.has-drawer>.em-drawer{position:relative;top:auto;right:auto;justify-self:end;min-height:100%}}
@media(max-width:560px){#emo-log-usability-review .em-demo,#emo-log-usability-review .em-eventtime,#emo-log-usability-review .em-count,#emo-log-usability-review .em-kind,#emo-log-usability-review .em-branchmeta{font-size:11px}#emo-log-usability-review .em-event{grid-template-columns:78px 44px minmax(0,1fr);gap:4px}#emo-log-usability-review .em-eventmessage{grid-column:1 / -1;grid-row:2}#emo-log-usability-review .em-event>.em-chevron{grid-column:3;grid-row:1;text-align:right}#emo-log-usability-review .em-branchmeta{margin-left:auto}#emo-log-usability-review .em-filters{grid-template-columns:minmax(0,1fr)}}

#emo-log-usability-review .em-tasktiming{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;color:var(--em-muted);font-size:12px;margin:-4px 0 12px;font-variant-numeric:tabular-nums}
#emo-log-usability-review .em-taskelapsed{color:var(--em-text);font-weight:600}
#emo-log-usability-review .em-taskrow .em-tasktiming{margin:5px 0 0;font-size:11px}
#emo-log-usability-review .em-taskrow .em-tasktiming>span:first-child{display:none}
#emo-log-usability-review .em-clockbar{background:var(--em-bg);color:var(--em-muted);border-top:1px solid var(--em-border);border-bottom:1px solid var(--em-border);padding:5px 10px;margin:0 -18px 10px;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:11px}
#emo-log-usability-review .em-clockbar button{font-size:11px;min-height:25px;padding:2px 7px}
#emo-log-usability-review .em-clocklabel{margin-right:auto}

<script>

  function group(id,parent,label,kind,status,context={},time=''){const g={id,parent,label,kind,status,context,time,children:[]};groups[id]=g;if(parent)groups[parent].children.push({kind:'group',id});return g;}
  function event(parent,time,level,message,type='node.log',extra={}){let cursor=groups[parent],context={};const lineage=[];while(cursor){lineage.unshift(cursor);cursor=groups[cursor.parent];}lineage.forEach(g=>Object.assign(context,g.context));const id='event-'+(++eventSeq);const e={id,eventId:eventSeq,timestampMs:typeof time==='number'?time:Date.parse(baseDate+'T'+time+'+08:00'),time:typeof time==='number'?stamp(time):time,level,message,eventType:type,source:'runtime',originApp:'runtime',runtimeInstanceId:'runtime-demo-01',component:'operator',deviceId:'',code:'',...context,...extra,groupId:parent,path:lineage.map(g=>g.label)};normalizeMockLog(e);events.push(e);groups[parent].children.push({kind:'event',id});return e;}
  function task(id,name,mode,status,start,rootId){tasks[id]={id,name,mode,status,start,rootId,projectId:'footpad-assembly',projectName:'脚垫装配',runtimeInstanceId:'runtime-demo-01',active:status==='运行中'};return tasks[id];}
  task('Job-001','主采集流程','单次启动 · While 持续运行','运行中','09:20:00','main-call');
  group('main-call',null,'主采集流程 · 本次调用','工作流','运行中',{jobId:'Job-001',projectId:'footpad-assembly',workflowId:'main',workflowName:'主采集流程',workflowRunId:'wfr-main-01',parentWorkflowRunId:'',iterationPath:[],cycleId:'cycle-main-01'},'09:20:00');
  event('main-call','09:20:00.000','INFO','工作流开始执行','workflow.started',{component:'workflow'});
  group('while-main','main-call','While · 持续检测','循环','运行中',{nodeId:'while_detect',nodeName:'持续检测',nodeRunId:'nr-while-main-01',callerNodeId:'while_detect'},'09:20:00');
  event('while-main','09:20:00.010','DEBUG','While 循环开始','loop.started',{component:'workflow',payload:{mode:'while'}});
  function makeIteration(n,active=false,explicitStartMs=null){
    const sec=n===1?'01':n===2?'05':String(5+(n-2)*5).padStart(2,'0');
    const beginMs=explicitStartMs==null?Date.parse(baseDate+'T09:20:'+sec+'.000+08:00'):explicitStartMs;
    const at=offset=>beginMs+offset;
    const prefix=stamp(beginMs).slice(0,8);

    group(iid,'while-main','第 '+n+' 轮','轮次',active?'执行中':'已完成',{iterationPath:[n-1],workflowId:'capture-body',workflowName:'采集循环体',workflowRunId:'wfr-body-'+n,parentWorkflowRunId:'wfr-main-01',nodeId:'',nodeName:'',nodeRunId:''},prefix);
    event(iid,at(0),'DEBUG','本轮开始','loop.iteration.started',{component:'workflow',workflowId:'main',workflowName:'主采集流程',workflowRunId:'wfr-main-01',parentWorkflowRunId:'',nodeId:'while_detect',nodeName:'持续检测',nodeRunId:'nr-while-main-01',payload:{iteration:n-1}});
    const cam='camera-'+n;
    group(cam,iid,'相机采图','节点','已完成',{nodeId:'camera',nodeName:'相机采图',nodeRunId:'nr-camera-'+n,deviceId:'camera-01'},prefix);
    event(cam,at(120),'INFO','图像采集完成 · 2448 × 2048','node.log',{payload:{width:2448,height:2048,deviceId:'camera-01'}});
    const vision='vision-'+n;
    group(vision,iid,'视觉检测','子流程',active?'执行中':'已完成',{workflowId:'vision',workflowName:'视觉检测',workflowRunId:'wfr-vision-'+n,parentWorkflowRunId:'wfr-body-'+n,nodeId:'',nodeName:'',nodeRunId:'',callerNodeId:'call_vision'},prefix);
    event(vision,at(200),'DEBUG','进入视觉检测子流程','workflow.started',{component:'workflow',nodeId:'call_vision',nodeName:'调用视觉检测',nodeRunId:''});
    if(n===2){
      group('for-repeat-2',vision,'For · 重复检测','循环','已完成',{nodeId:'repeat_detect',nodeName:'重复检测',nodeRunId:'nr-for-2'},prefix);
      event('for-repeat-2',at(210),'DEBUG','For 循环开始','loop.started',{component:'workflow',payload:{mode:'repeat'}});

        group('detect-2-'+j,'for-iteration-2-'+j,'YOLO 推理','节点','已完成',{nodeId:'detect',nodeName:'YOLO 推理',nodeRunId:'nr-detect-2-'+j},prefix);
        event('detect-2-'+j,at(300+j*100),'INFO','推理完成 · 未发现缺陷','node.log',{payload:{result:'OK',elapsedMs:64+j*3}});
      }

      group('detect-'+n,vision,'YOLO 推理','节点',active?'执行中':'已完成',{nodeId:'detect',nodeName:'YOLO 推理',nodeRunId:'nr-detect-'+n},prefix);

    }
    if(!active){
      const plc='plc-'+n;
      group(plc,iid,'PLC 写入','节点','已完成',{nodeId:'plc_write',nodeName:'PLC 写入',nodeRunId:'nr-plc-'+n,deviceId:'plc-01'},prefix);
      if(n===2)event(plc,at(620),'WARN','PLC 响应较慢 · 准备重试','node.log',{code:'PLC_RETRY',payload:{attempt:1,deviceId:'plc-01'}});
      event(plc,at(850),'INFO',n===2?'重试成功 · 结果已写入 PLC':'结果已写入 PLC','node.log',{payload:{deviceId:'plc-01',result:'OK'}});
      event(iid,at(920),'DEBUG','本轮执行结束','loop.iteration.completed',{component:'workflow',workflowId:'main',workflowName:'主采集流程',workflowRunId:'wfr-main-01',parentWorkflowRunId:'',nodeId:'while_detect',nodeName:'持续检测',nodeRunId:'nr-while-main-01',payload:{iteration:n-1}});
    }
    if(n>3){setTiming(iid,beginMs,active?null:beginMs+920);setTiming(cam,beginMs+20,beginMs+120);setTiming(vision,beginMs+200,active?null:beginMs+560);setTiming('detect-'+n,beginMs+280,active?null:beginMs+560);}
    return iid;
  }
  makeIteration(1);makeIteration(2);makeIteration(3,true);
  task('Job-002','批量图片检测','单次启动 · ForEach','运行中','09:19:30','batch-call');
  group('batch-call',null,'批量图片检测 · 本次调用','工作流','运行中',{jobId:'Job-002',projectId:'footpad-assembly',workflowId:'batch',workflowName:'批量图片检测',workflowRunId:'wfr-batch-01',parentWorkflowRunId:'',iterationPath:[],cycleId:'cycle-batch-01'},'09:19:30');
  event('batch-call','09:19:30.000','INFO','工作流开始执行','workflow.started',{component:'workflow'});
  group('foreach-batch','batch-call','ForEach · 图片列表','循环','运行中',{nodeId:'foreach_images',nodeName:'图片列表',nodeRunId:'nr-foreach-01'},'09:19:30');
  for(let n=1;n<=3;n++){
    const time='09:19:'+String(30+n*4);
    group('batch-item-'+n,'foreach-batch','第 '+n+' 次 · image_00'+n+'.png','轮次',n===3?'执行中':'已完成',{workflowId:'batch-body',workflowName:'图片处理',workflowRunId:'wfr-batch-body-'+n,parentWorkflowRunId:'wfr-batch-01',iterationPath:[n-1],nodeId:'',nodeName:'',nodeRunId:'',callerNodeId:'foreach_images'},time);
    group('batch-detect-'+n,'batch-item-'+n,'图像检测','节点',n===3?'执行中':'已完成',{nodeId:'detect',nodeName:'图像检测',nodeRunId:'nr-batch-detect-'+n},time);
    event('batch-detect-'+n,time+'.000','INFO',n===3?'开始处理 image_003.png':'image_00'+n+'.png 检测完成',n===3?'node.started':'node.log');
  }
  task('Job-003','设备自检','单次启动','失败','09:17:04','check-call');tasks['Job-003'].ended='09:17:07';
  group('check-call',null,'设备自检 · 本次调用','工作流','失败',{jobId:'Job-003',projectId:'footpad-assembly',workflowId:'self-check',workflowName:'设备自检',workflowRunId:'wfr-check-01',parentWorkflowRunId:'',iterationPath:[],cycleId:'cycle-check-01'},'09:17:04');
  event('check-call','09:17:04.000','INFO','工作流开始执行','workflow.started',{component:'workflow'});
  group('check-plc','check-call','PLC 连接检测','节点','失败',{nodeId:'plc_check',nodeName:'PLC 连接检测',nodeRunId:'nr-check-plc-01',deviceId:'plc-01'},'09:17:04');
  event('check-plc','09:17:07.001','ERROR','PLC 连接超时','node.failed',{code:'PLC_CONNECT_TIMEOUT',payload:{deviceId:'plc-01',timeoutMs:3000}});
  event('check-call','09:17:07.010','ERROR','设备自检失败，工作流已结束','workflow.failed',{component:'workflow',code:'PLC_CONNECT_TIMEOUT'});
  task('Job-004','连续尺寸检测','连续运行 · 重复调用工作流','运行中','09:18:00','continuous-session');
  group('continuous-session',null,'连续运行 · 本任务内的调用','任务','运行中',{jobId:'Job-004',projectId:'footpad-assembly',iterationPath:[],workflowId:'dimension',workflowName:'尺寸检测',workflowRunId:'',parentWorkflowRunId:'',cycleId:''},'09:18:00');
  [1,2,3].forEach((n)=>{const callId='continuous-call-'+n;const time='09:18:'+String(n*4).padStart(2,'0');group(callId,'continuous-session','尺寸检测 · '+time+' 启动','工作流',n===3?'运行中':'已完成',{workflowRunId:'wfr-continuous-c0'+n,parentWorkflowRunId:'',cycleId:'cycle-continuous-c0'+n},time);event(callId,time+'.000','INFO','尺寸检测开始','workflow.started',{component:'workflow'});group('continuous-node-'+n,callId,'测量尺寸','节点',n===3?'执行中':'已完成',{nodeId:'measure',nodeName:'测量尺寸',nodeRunId:'nr-measure-c0'+n},time);event('continuous-node-'+n,time+'.500','INFO',n===3?'开始测量尺寸':'尺寸测量完成',n===3?'node.started':'node.completed');if(n<3)event(callId,time+'.700','INFO','本次工作流调用结束','workflow.completed',{component:'workflow'});});

  task('Job-005','本批采集','单次启动','已完成','09:19:50','source-call');
  tasks['Job-005'].active=true;
  tasks['Job-005'].associatedTaskIds=['Job-006','Job-007'];
  group('source-call',null,'本批采集 · 本次调用','工作流','已完成',{jobId:'Job-005',projectId:'footpad-assembly',workflowId:'capture-once',workflowName:'本批采集',workflowRunId:'wfr-source-01',parentWorkflowRunId:'',iterationPath:[],cycleId:'cycle-source-01'},'09:19:50');
  event('source-call','09:19:50.000','INFO','工作流开始执行','workflow.started',{component:'workflow'});
  event('source-call','09:20:10.000','INFO','本批采集完成','workflow.completed',{component:'workflow'});
  task('Job-006','检测任务','由本批采集启动','运行中','09:19:51','consumer-detect-call');
  tasks['Job-006'].sourceJobId='Job-005';
  group('consumer-detect-call',null,'检测任务 · 本次调用','工作流','运行中',{jobId:'Job-006',projectId:'footpad-assembly',workflowId:'consumer-detect',workflowName:'检测任务',workflowRunId:'wfr-consumer-detect-01',parentWorkflowRunId:'',iterationPath:[],cycleId:'cycle-consumer-detect-01'},'09:19:51');
  event('consumer-detect-call','09:19:51.000','INFO','工作流开始执行','workflow.started',{component:'workflow'});
  group('consumer-detect-node','consumer-detect-call','YOLO 推理','节点','执行中',{nodeId:'detect',nodeName:'YOLO 推理',nodeRunId:'nr-consumer-detect-01'},'09:20:12');
  event('consumer-detect-node','09:20:12.000','INFO','开始执行推理','node.started');
  task('Job-007','保存结果任务','由本批采集启动','运行中','09:19:51','consumer-save-call');
  tasks['Job-007'].sourceJobId='Job-005';
  group('consumer-save-call',null,'保存结果任务 · 本次调用','工作流','运行中',{jobId:'Job-007',projectId:'footpad-assembly',workflowId:'consumer-save',workflowName:'保存结果任务',workflowRunId:'wfr-consumer-save-01',parentWorkflowRunId:'',iterationPath:[],cycleId:'cycle-consumer-save-01'},'09:19:51');
  event('consumer-save-call','09:19:51.000','INFO','工作流开始执行','workflow.started',{component:'workflow'});
  group('consumer-save-node','consumer-save-call','SQLite 写入','节点','执行中',{nodeId:'save',nodeName:'SQLite 写入',nodeRunId:'nr-consumer-save-01'},'09:20:12');
  event('consumer-save-node','09:20:12.200','INFO','开始写入结果','node.started');
  task('Job-008','启动前检查','单次启动','已完成','09:16:00','startup-check-call');
  group('startup-check-call',null,'启动前检查 · 本次调用','工作流','已完成',{jobId:'Job-008',projectId:'footpad-assembly',workflowId:'startup-check',workflowName:'启动前检查',workflowRunId:'wfr-startup-check-01',parentWorkflowRunId:'',iterationPath:[],cycleId:'cycle-startup-check-01'},'09:16:00');
  event('startup-check-call','09:16:00.000','INFO','工作流开始执行','workflow.started',{component:'workflow'});
  event('startup-check-call','09:16:00.480','INFO','启动前检查完成','workflow.completed',{component:'workflow'});

  const toMs=time=>Date.parse(baseDate+'T'+time+'+08:00');
  const clock={nowMs:toMs('09:20:12.500'),playing:false,startedAt:0};
  const monotonicNow=()=>typeof performance!=='undefined'?performance.now():Date.now();
  function clockNow(){return clock.nowMs+(clock.playing?Math.max(0,monotonicNow()-clock.startedAt):0);}
  function stamp(ms,full=false){if(!Number.isFinite(ms))return '—';const iso=new Date(ms+8*3600000).toISOString();return (full?iso.slice(0,10)+' ':'')+iso.slice(11,23);}
  function elapsed(ms){if(ms==null||!Number.isFinite(ms))return '—';ms=Math.max(0,ms);if(ms<1000)return Math.round(ms)+' ms';if(ms<60000)return (ms/1000).toFixed(2)+' s';const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h?h+' 时 '+String(m%60).padStart(2,'0')+' 分 '+String(s%60).padStart(2,'0')+' 秒':m+' 分 '+String(s%60).padStart(2,'0')+' 秒';}
  function setTiming(id,start,end=null,reason=''){const g=groups[id];g.timing={startMs:start==null?null:(typeof start==='number'?start:toMs(start)),endMs:end==null?null:(typeof end==='number'?end:toMs(end)),confirmedRunning:g.status==='运行中'||g.status==='执行中',reason};}
  // Explicit execution boundaries for the mock data; never inferred from a first/last business log.
  setTiming('main-call','09:20:00.000');
  setTiming('while-main','09:20:00.010');
  [1,2,3].forEach(n=>{
    const prefix=n===1?'09:20:01':n===2?'09:20:05':'09:20:10';
    const live=n===3;
    setTiming('while-iteration-'+n,prefix+'.000',live?null:prefix+'.920');
    setTiming('camera-'+n,prefix+'.020',prefix+'.120');
    setTiming('vision-'+n,prefix+'.200',live?null:prefix+'.560');
    if(n!==2)setTiming('detect-'+n,prefix+(live?'.280':'.213'),live?null:prefix+'.280');
    if(!live)setTiming('plc-'+n,prefix+'.570',prefix+'.850');
  });
  setTiming('for-repeat-2','09:20:05.210','09:20:05.530');
  setTiming('for-iteration-2-1','09:20:05.300','09:20:05.410');
  setTiming('detect-2-1','09:20:05.333','09:20:05.400');
  setTiming('for-iteration-2-2','09:20:05.420','09:20:05.510');
  setTiming('detect-2-2','09:20:05.430','09:20:05.500');
  setTiming('batch-call','09:19:30.000');
  setTiming('foreach-batch','09:19:30.010');
  [1,2,3].forEach(n=>{
    const end=toMs('09:19:'+String(30+n*4)+'.000');
    setTiming('batch-item-'+n,n===3?end:end-200,n===3?null:end+50);
    setTiming('batch-detect-'+n,n===3?end:end-180,n===3?null:end);
  });
  setTiming('check-call','09:17:04.000','09:17:07.010');
  setTiming('check-plc','09:17:04.001','09:17:07.001');
  setTiming('continuous-session','09:18:00.000');
  [1,2,3].forEach(n=>{
    const t=toMs('09:18:'+String(n*4).padStart(2,'0')+'.000');
    setTiming('continuous-call-'+n,t,n===3?null:t+700);
    setTiming('continuous-node-'+n,n===3?t+500:t+100,n===3?null:t+500);
  });
  Object.values(tasks).forEach(t=>{t.timing={startMs:toMs(t.start),endMs:t.id==='Job-003'?toMs('09:17:07.020'):null,confirmedRunning:t.active};});
  tasks['Job-003'].ended='09:17:07.020';
  setTiming('source-call','09:19:50.000','09:20:10.000');
  tasks['Job-005'].timing={startMs:toMs('09:19:50.000'),endMs:toMs('09:20:10.000'),confirmedRunning:false};
  tasks['Job-005'].ended='09:20:10.000';
  setTiming('consumer-detect-call','09:19:51.000');
  setTiming('consumer-detect-node','09:20:12.000');
  setTiming('consumer-save-call','09:19:51.000');
  setTiming('consumer-save-node','09:20:12.200');
  setTiming('startup-check-call','09:16:00.000','09:16:00.480');
  tasks['Job-008'].timing={startMs:toMs('09:16:00.000'),endMs:toMs('09:16:00.480'),confirmedRunning:false};
  tasks['Job-008'].ended='09:16:00.480';
  function timingOf(entity,at=clockNow()){
    const t=entity&&entity.timing||{};
    if(entity&&['未开始','已跳过','待执行'].includes(entity.status))return {startMs:null,endMs:null,durationMs:null,estimated:false,reason:'未执行',placeholder:true};
    const started=Number.isFinite(t.startMs),ended=Number.isFinite(t.endMs);
    if(!started)return {startMs:null,endMs:ended?t.endMs:null,durationMs:null,estimated:false,reason:t.reason||'缺少开始时间'};
    if(ended)return {startMs:t.startMs,endMs:t.endMs,durationMs:t.endMs>=t.startMs?t.endMs-t.startMs:null,estimated:false,reason:t.endMs<t.startMs?'时间记录不一致':''};
    if(t.confirmedRunning&&at>=t.startMs)return {startMs:t.startMs,endMs:null,durationMs:at-t.startMs,estimated:true,reason:''};
    return {startMs:t.startMs,endMs:null,durationMs:null,estimated:false,reason:t.reason||(at<t.startMs?'尚未开始':'缺少结束时间')};
  }
  function getTimedEntity(key){return key.startsWith('task:')?tasks[key.slice(5)]:groups[key];}
  function timingText(key,mode='duration'){
    const t=timingOf(getTimedEntity(key));
    if(mode==='start')return stamp(t.startMs,true);
    if(mode==='end')return t.endMs!=null?stamp(t.endMs,true):(t.estimated?'尚未结束':t.reason);
    if(mode==='range')return stamp(t.startMs)+' → '+(t.endMs!=null?stamp(t.endMs):(t.estimated?'进行中':'—'));
    if(t.placeholder)return '—';
    if(t.durationMs==null)return '时间不完整';
    return (t.estimated?'已运行 ≈ ':key.startsWith('task:')?'运行耗时 ':'耗时 ')+elapsed(t.durationMs);
  }
  function timedText(key,mode='duration',css=''){return '<span class="em-timing-text '+css+'" data-time-key="'+esc(key)+'" data-time-mode="'+mode+'">'+esc(timingText(key,mode))+'</span>';}
  function groupContext(id){let g=groups[id];const chain=[];while(g){chain.unshift(g);g=groups[g.parent];}return {context:Object.assign({},...chain.map(x=>x.context)),path:chain.map(x=>x.label)};}

<script>
// Reference-only scene entry points. All records and connections remain simulated.
window.__emoReferenceReady=(async function(){
  const p=window.__emoPrototype;
  const scene=location.hash.slice(1)||'01_runtime_tasks';
  p.clock.playing=false;
  if(scene==='08_operator_reading'){p.openOperatorExample('yolo');return;}
  if(scene==='09_operator_debug'){p.openOperatorExample('yolo');p.openDebugDemo();return;}
  if(scene==='01_runtime_tasks'){await p.action('home');return;}
  if(scene==='07_designer_logs'){p.switchSection('designer');await p.feedAction('feed-select','designer-connect-error');return;}
  p.openTask(scene==='04_continuous_calls'?'Job-004':'Job-001');
  p.state.selected=null;p.state.selectedGroup=null;p.state.advanced=false;p.state.taskInfo=false;
  if(scene==='02_while_tree'){
    p.state.expanded=new Set(['main-call','while-main','while-iteration-2','vision-2','for-repeat-2','for-iteration-2-1','for-iteration-2-2','while-iteration-3','vision-3']);
    p.render();return;
  }
  if(scene==='04_continuous_calls'){await p.action('expand-all');return;}
  if(scene==='05_execution_time'){
    p.state.displaySettings=true;
    p.state.expanded=new Set(['main-call','while-main','while-iteration-2']);
    await p.action('time-mode','range');await p.action('select-timing','plc-2');return;
  }
  const e=p.events.find(e=>e.code==='PLC_RETRY');
  if(scene==='03_filter_drawer'){
    p.state.advanced=true;p.setFilter('level','WARN');p.expandEventAncestors(e);p.selectEvent(e.id);return;
  }
  if(scene==='06_device_diagnostics'){
    p.expandEventAncestors(e);p.selectEvent(e.id);p.openDeviceDiagnostics('plc-01');await p.action('diagnostic-select','diag-plc-retry');return;
  }
  p.render();
})();
</script>
