[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emo_panel_protocol"
version = "1.1.0"
description = "Shared Runtime RPC, result identities and published panel contract"
requires-python = ">=3.10"
dependencies = ["grpcio==1.78.0", "protobuf==6.33.6", "pydantic>=2.6"]

[tool.setuptools]
packages = ["emo_panel_protocol", "emo_panel_protocol.generated"]
package-dir = {"" = "../../src"}
