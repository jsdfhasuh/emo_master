syntax = "proto3";

package emo_master.runtime;

message LoadProjectRequest {
  string project_path = 1;
}

message LoadProjectReply {
  bool ok = 1;
  string status = 2;
  string message = 3;
}

// Explicit first publication of an in-memory draft. resource_root is a
// Runtime-visible directory, not an uploaded Designer filesystem path.
message InitialProjectConfigurationRequest {
  string request_id = 1;
  string local_payload_json = 2;
  string resource_root = 3;
  bool validate_only = 4;
  string expected_runtime_instance_id = 5;
  // Source identity only: the in-memory payload is authoritative; never save this file.
  string project_path = 6;
}

message ValidateProjectRequest {
  string project_id = 1;
}

message OnlineProjectRequest { string project_id = 1; }
message OnlineGraphRequest {
  string project_id = 1;
  int64 document_revision = 2;
  string job_id = 3;
}
message ProjectConfigurationWriteRequest {
  string request_id = 1;
  string expected_runtime_instance_id = 2;
  int64 expected_revision = 3;
  string local_payload_json = 4;
  repeated string selected_paths = 5;
  string replacement_policy = 6;
  // Explicit embedded-Designer relocation; never a remote client's filesystem path.
  string local_project_path = 7;
}
message ProjectWriteLookup { string request_id = 1; }
message ProjectResourceTransferRequest {
  string runtime_instance_id = 1;
  string project_id = 2;
  string transfer_id = 3;
  string action = 4; // LOOKUP, BEGIN, CHUNK, COMMIT, STATUS, CANCEL.
  string resource_json = 5;
  uint64 offset = 6;
  bytes data = 7;
  string replacement_of = 8;
  int64 expected_document_revision = 9;
}
message RetryProjectResourceRecoveryRequest {
  string request_id = 1;
  string project_id = 2;
  string expected_runtime_instance_id = 3;
  int64 expected_document_revision = 4;
}
message ProjectConfigurationReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string result_json = 4;
}

message ValidateProjectReply {
  bool ok = 1;
  repeated string errors = 2;
}

message StartJobRequest {
  string project_id = 1;
  string workflow_id = 2;
  string inputs_json = 3;
  bool capture_presentation = 4;
  string start_request_id = 5;
  string expected_runtime_instance_id = 6;
  string legacy_snapshot_policy = 7; // Empty means ALL, preserving old clients.
  string inspection_session_id = 8; // Optional, session-only node result retention.
  int64 expected_document_revision = 9; // Optional online snapshot CAS; zero preserves legacy starts.
}

message StartJobReply {
  bool ok = 1;
  string job_id = 2;
  string message = 3;
  string status = 4;
  string runtime_instance_id = 5;
  string start_request_id = 6;
  string legacy_snapshot_policy = 7;
  int64 project_revision = 8;
  string inspection_session_id = 9;
  string diagnostics_json = 10; // Structured pre-start validation; raw message remains available.
}

message StartRequestLookup {
  string start_request_id = 1;
  string runtime_instance_id = 2;
}

message StopJobRequest {
  string job_id = 1;
  string mode = 2;
}

message StopJobReply {
  bool ok = 1;
  string status = 2;
  string message = 3;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusReply {
  bool ok = 1;
  string status = 2;
  string error_code = 3;
  string message = 4;
  string project_id = 5;
  string workflow_id = 6;
  int64 pid = 7;
  int64 accepted_at_ms = 8;
  int64 started_at_ms = 9;
  int64 ended_at_ms = 10;
  string legacy_snapshot_policy = 11;
}

message StreamJobEventsRequest {
  string job_id = 1;
  int64 after_sequence = 2;
  bool follow = 3;
}

message JobEvent {
  string job_id = 1;
  string node_id = 2;
  string event_type = 3;
  string level = 4;
  string code = 5;
  string message = 6;
  string payload_json = 7;
  int64 timestamp_ms = 8;
  int64 sequence = 9;
  string project_id = 10;
  string workflow_id = 11;
  string workflow_run_id = 12;
  string parent_workflow_run_id = 13;
  string node_run_id = 14;
  string iteration_path_json = 15;
}

message ListOperatorsRequest {}

message ListDeviceTypesRequest {}
message ListDeviceTypesReply {
  string types_json = 1;
  string requirements_json = 2;
  string rejected_json = 3;
}

message GetDeviceStatesRequest { string project_id = 1; }
message GetDeviceDiagnosticsRequest {
  string runtime_instance_id = 1;
  string project_id = 2;
  string project_load_generation = 3;
  string device_id = 4;
  int64 cursor = 5;
}
message GetDeviceDiagnosticsReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string diagnostics_json = 4;
}
message ControlDeviceRequest {
  string project_id = 1;
  string runtime_instance_id = 2;
  string device_id = 3;
  string expected_generation = 4;
  string expected_definition_revision = 5;
  string action = 6;
  bool confirmed = 7;
  string expected_control_revision = 8;
}
message ExecuteDeviceActionRequest {
  string project_id = 1;
  string runtime_instance_id = 2;
  string device_id = 3;
  string expected_generation = 4;
  string expected_definition_revision = 5;
  string expected_control_revision = 6;
  string action = 7;
  string arguments_json = 8;
  bool confirmed = 9;
  string request_id = 10;
}
message ExecuteDeviceActionReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string result_json = 4;
}
message CameraDiagnosticRequest {
  string project_id = 1;
  string runtime_instance_id = 2;
  string device_id = 3;
  string expected_definition_revision = 4;
  string expected_generation = 5;
  string session_id = 6;
  string action = 7;
  int64 sequence = 8;
  bool confirmed = 9;
  string changes_json = 10;
}
message CameraDiagnosticReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string session_id = 4;
  string metadata_json = 5;
  bytes preview_jpeg = 6;
}
message RecoverDeviceRequest {
  string project_id = 1;
  string runtime_instance_id = 2;
  string device_id = 3;
  string expected_generation = 4;
  string expected_definition_revision = 5;
  bool hardware_synchronized = 6;
}
message DeviceNetworkRequest {
  string project_id = 1;
  string runtime_instance_id = 2;
  string device_id = 3;
  string request_id = 4;
  string action = 5;
  string payload_json = 6;
}
message GetDeviceStatesReply {
  bool ok = 1;
  string runtime_instance_id = 2;
  string project_id = 3;
  string states_json = 4;
  string message = 5;
  string code = 6;
  string project_load_generation = 7;
  optional uint64 runtime_uptime_ms = 8;
}

message OperatorInfo {
  string operator_id = 1;
  string display_name = 2;
  string version = 3;
  map<string, string> input_ports = 4;
  map<string, string> output_ports = 5;
  string param_schema_json = 6;
  string category = 7;
  string icon_key = 8;
  string summary = 9;
  string input_port_specs_json = 10;
  string output_port_specs_json = 11;
  string editor_spec_json = 12;
  string editor_issues_json = 13;
  OperatorIconInfo icon = 14;
  repeated OperatorIconIssue icon_issues = 15;
  string device_requirements_json = 16;
  reserved 17;
  reserved "device_binding_since";
}

message OperatorIconInfo {
  string status = 1;
  string mime_type = 2;
  string sha256 = 3;
  uint32 byte_size = 4;
}

message OperatorIconIssue {
  string rule_id = 1;
  string code = 2;
  string message = 3;
}

message GetOperatorIconAssetRequest {
  string operator_id = 1;
  string version = 2;
  string expected_sha256 = 3;
}

message GetOperatorIconAssetReply {
  bool ok = 1;
  bytes content = 2;
  string mime_type = 3;
  string sha256 = 4;
  string code = 5;
  string message = 6;
  string version = 7;
}

message ListOperatorsReply {
  repeated OperatorInfo operators = 1;
  string camera_recovery_warnings_json = 2;
}

message GetOperatorEditorAssetRequest {
  string operator_id = 1;
  string version = 2;
}

message GetOperatorEditorAssetReply {
  bool ok = 1;
  bytes content = 2;
  string sha256 = 3;
  string message = 4;
}

message ListNodePreviewSourcesRequest {
  string project_id = 1;
  string workflow_id = 2;
  string node_id = 3;
  string job_id = 4; // Explicit selected run; empty never chooses a global last Job.
  string inspection_session_id = 5;
  string workflow_run_id = 6;
  string node_run_id = 7;
}

message PreviewSourceInfo {
  string source_id = 1;
  string label = 2;
  string source_kind = 3;
  string workflow_id = 4;
  string node_id = 5;
  string port = 6;
  int32 width = 7;
  int32 height = 8;
  string mime_type = 9;
  string iteration_path_json = 10;
  string origin_job_id = 11;
  int64 origin_project_revision = 12;
  string capture_id = 13;
  int64 created_at_ms = 14;
  string snapshot_state = 15;
  string workflow_run_id = 16;
  string node_run_id = 17;
  int32 original_width = 18;
  int32 original_height = 19;
}

message ListNodePreviewSourcesReply {
  repeated PreviewSourceInfo sources = 1;
  string job_id = 2;
  string legacy_snapshot_policy = 3;
  string capture_state = 4;
  string message = 5;
}

message PreviewUploadChunk {
  string upload_id = 1;
  string filename = 2;
  bytes content = 3;
  string project_id = 4;
  string draft_session_id = 5; // Pure draft previews never fall back to loaded-project ownership.
}

message PreviewAssetReply {
  bool ok = 1;
  string asset_id = 2;
  string code = 3;
  string message = 4;
  int32 width = 5;
  int32 height = 6;
  string mime_type = 7;
}

message GetPreviewAssetRequest {
  string asset_id = 1;
  string project_id = 2;
  string inspection_session_id = 3;
  string draft_session_id = 4;
}

message RunInspectionSessionRequest {
  string project_id = 1;
  string session_id = 2;
}

message RunInspectionSessionReply {
  bool ok = 1;
  string session_id = 2;
  string runtime_instance_id = 3;
  int32 ttl_ms = 4;
  string code = 5;
  string message = 6;
}

message PreviewDownloadChunk {
  string asset_id = 1;
  string mime_type = 2;
  bytes content = 3;
}

message RunOperatorPreviewRequest {
  string project_id = 1;
  string workflow_id = 2;
  string node_id = 3;
  string operator_id = 4;
  string params_json = 5;
  string image_asset_id = 6;
  string request_id = 7;
  string project_json = 8;
  string job_id = 9;
  string draft_session_id = 10;
}

message PreviewOutputAsset {
  string port = 1;
  string asset_id = 2;
  string mime_type = 3;
  int32 width = 4;
  int32 height = 5;
}

message RunOperatorPreviewReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string outputs_json = 4;
  repeated PreviewOutputAsset assets = 5;
}

message CancelOperatorPreviewRequest {
  string request_id = 1;
}

message CancelOperatorPreviewReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
}

message OpenOperatorPreviewSessionRequest {
  string project_id = 1;
  string workflow_id = 2;
  string node_id = 3;
  string operator_id = 4;
  string params_json = 5;
  // Required by draft preview open RPCs; never replaces the loaded project.
  string project_json = 6;
  string job_id = 7;
  bool configuration_only = 8;
}

message OpenOperatorPreviewSessionReply {
  bool ok = 1;
  string session_id = 2;
  string code = 3;
  string message = 4;
}

message StreamOperatorPreviewFramesRequest {
  string session_id = 1;
}

message OperatorPreviewFrame {
  string session_id = 1;
  bytes jpeg = 2;
  int64 sequence = 3;
  int64 block_id = 4;
  int64 device_timestamp = 5;
  double actual_exposure_us = 6;
  int32 width = 7;
  int32 height = 8;
  string state = 9;
  int64 generation = 10;
  string code = 11;
  string message = 12;
}

message ConfigureOperatorSessionRequest {
  string session_id = 1;
  string device_identity = 2;
  string request_id = 3;
  string action = 4;
  string payload_json = 5;
}

message ConfigureOperatorSessionReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string state_json = 4;
  string warnings_json = 5;
}

message CloseOperatorPreviewSessionRequest {
  string session_id = 1;
}

message CloseOperatorPreviewSessionReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
}

message ListRejectedOperatorsRequest {}

message RejectedOperatorInfo {
  string operator_id = 1;
  string code = 2;
  string message = 3;
}

message ListRejectedOperatorsReply {
  repeated RejectedOperatorInfo rejected = 1;
}

message ListWorkflowsRequest {
  string project_id = 1;
}

message WorkflowInfo {
  string workflow_id = 1;
  string name = 2;
  bool is_entry = 3;
  string inputs_json = 4;
  string outputs_json = 5;
}

message ListWorkflowsReply {
  repeated WorkflowInfo workflows = 1;
}

message GlobalCounterInfo {
  string name = 1;
  int64 value = 2;
  int64 updated_at_ms = 3;
}

message ListGlobalCountersRequest {
  string project_id = 1;
}

message ListGlobalCountersReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  repeated GlobalCounterInfo counters = 4;
}

message GetGlobalCounterRequest {
  string project_id = 1;
  string name = 2;
}

message GetGlobalCounterReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  GlobalCounterInfo counter = 4;
}

message SetGlobalCounterRequest {
  string project_id = 1;
  string name = 2;
  int64 value = 3;
}

message SetGlobalCounterReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  GlobalCounterInfo counter = 4;
}

message ResetGlobalCounterRequest {
  string project_id = 1;
  string name = 2;
}

message ResetGlobalCounterReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  GlobalCounterInfo counter = 4;
}

message GlobalVariablesRequest {
  string project_id = 1;
  string job_id = 2;
  string variable_id = 3;
  string value_json = 4;
  optional int64 expected_revision = 5;
}

message GlobalVariablesReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string variables_json = 4;
  string jobs_json = 5;
}

message DispatchQueueRequest {
  string project_id = 1;
  string run_group_id = 2;
  string target_slot_id = 3;
  bool include_items = 4;
}

message DispatchQueueReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string state_json = 4;
}

service RuntimeService {
  rpc GetDispatchQueueState(DispatchQueueRequest) returns (DispatchQueueReply);
  rpc GetOnlineProjectSnapshot(OnlineProjectRequest) returns (ProjectConfigurationReply);
  rpc InitializeProjectConfiguration(InitialProjectConfigurationRequest) returns (ProjectConfigurationReply);
  rpc GetOnlineGraphSnapshot(OnlineGraphRequest) returns (ProjectConfigurationReply);
  rpc ValidateProjectWrite(ProjectConfigurationWriteRequest) returns (ProjectConfigurationReply);
  rpc WriteProjectConfiguration(ProjectConfigurationWriteRequest) returns (ProjectConfigurationReply);
  rpc GetProjectWriteStatus(ProjectWriteLookup) returns (ProjectConfigurationReply);
  rpc CancelProjectWrite(ProjectWriteLookup) returns (ProjectConfigurationReply);
  rpc TransferProjectResource(ProjectResourceTransferRequest) returns (ProjectConfigurationReply);
  rpc RetryProjectResourceRecovery(RetryProjectResourceRecoveryRequest) returns (ProjectConfigurationReply);
  rpc GetOperatorDebugCapabilities(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc OpenOperatorDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc GetOperatorDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc PrepareOperatorDebugInputs(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ExecuteOperatorDebugNode(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc GetOperatorDebugExecution(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ReadOperatorDebugEvents(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc CancelOperatorDebugExecution(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ResetOperatorDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc RenewOperatorDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc CloseOperatorDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc WriteOperatorDebugAsset(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ReadOperatorDebugAsset(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ListOperatorDebugSources(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ImportOperatorDebugSource(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc CopyOperatorDebugVariables(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc GetWorkflowDebugCapabilities(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc OpenWorkflowDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc GetWorkflowDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc PrepareWorkflowDebugInputs(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc StartWorkflowDebug(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ControlWorkflowDebug(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc GetWorkflowDebugCommand(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc GetWorkflowDebugSnapshot(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ReadWorkflowDebugEvents(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc WriteWorkflowDebugAsset(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ReadWorkflowDebugAsset(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc RenewWorkflowDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc CloseWorkflowDebugSession(OperatorDebugRequest) returns (OperatorDebugReply);
  rpc ListGlobalVariables(GlobalVariablesRequest) returns (GlobalVariablesReply);
  rpc GetGlobalVariable(GlobalVariablesRequest) returns (GlobalVariablesReply);
  rpc SetGlobalVariable(GlobalVariablesRequest) returns (GlobalVariablesReply);
  rpc ResetGlobalVariable(GlobalVariablesRequest) returns (GlobalVariablesReply);
  rpc OpenPlcDebugSession(OpenPlcDebugSessionRequest) returns (PlcDebugReply);
  rpc ExecutePlcDebugCommand(ExecutePlcDebugCommandRequest) returns (PlcDebugReply);
  rpc ClosePlcDebugSession(ClosePlcDebugSessionRequest) returns (PlcDebugReply);
  rpc InspectSqliteTarget (InspectSqliteTargetRequest) returns (SqliteTargetReply);
  rpc InitializeSqliteTarget (InitializeSqliteTargetRequest) returns (SqliteTargetReply);
  rpc OpenRunInspectionSession(RunInspectionSessionRequest) returns (RunInspectionSessionReply);
  rpc RenewRunInspectionSession(RunInspectionSessionRequest) returns (RunInspectionSessionReply);
  rpc CloseRunInspectionSession(RunInspectionSessionRequest) returns (RunInspectionSessionReply);
  rpc LoadProject(LoadProjectRequest) returns (LoadProjectReply);
  rpc GetCommunicationState(CommunicationRequest) returns (CommunicationReply);
  rpc ControlCommunication(CommunicationRequest) returns (CommunicationReply);
  rpc ValidateProject(ValidateProjectRequest) returns (ValidateProjectReply);
  rpc StartJob(StartJobRequest) returns (StartJobReply);
  rpc GetStartRequest(StartRequestLookup) returns (StartJobReply);
  rpc StopJob(StopJobRequest) returns (StopJobReply);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusReply);
  rpc StreamJobEvents(StreamJobEventsRequest) returns (stream JobEvent);
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsReply);
  rpc ListDeviceTypes(ListDeviceTypesRequest) returns (ListDeviceTypesReply);
  rpc GetDeviceStates(GetDeviceStatesRequest) returns (GetDeviceStatesReply);
  rpc GetDeviceDiagnostics(GetDeviceDiagnosticsRequest) returns (GetDeviceDiagnosticsReply);
  rpc RecoverDevice(RecoverDeviceRequest) returns (GetDeviceStatesReply);
  rpc DeviceNetworkCommand(DeviceNetworkRequest) returns (ProjectConfigurationReply);
  rpc ControlDevice(ControlDeviceRequest) returns (GetDeviceStatesReply);
  rpc ExecuteDeviceAction(ExecuteDeviceActionRequest) returns (ExecuteDeviceActionReply);
  rpc CameraDiagnostic(CameraDiagnosticRequest) returns (CameraDiagnosticReply);
  rpc GetOperatorIconAsset(GetOperatorIconAssetRequest) returns (GetOperatorIconAssetReply);
  rpc GetOperatorEditorAsset(GetOperatorEditorAssetRequest) returns (GetOperatorEditorAssetReply);
  rpc ListNodePreviewSources(ListNodePreviewSourcesRequest) returns (ListNodePreviewSourcesReply);
  rpc UploadPreviewImage(stream PreviewUploadChunk) returns (PreviewAssetReply);
  rpc StreamPreviewAsset(GetPreviewAssetRequest) returns (stream PreviewDownloadChunk);
  rpc RunOperatorPreview(RunOperatorPreviewRequest) returns (RunOperatorPreviewReply);
  rpc CancelOperatorPreview(CancelOperatorPreviewRequest) returns (CancelOperatorPreviewReply);
  rpc OpenOperatorPreviewSession(OpenOperatorPreviewSessionRequest) returns (OpenOperatorPreviewSessionReply);
  rpc OpenDraftOperatorPreviewSession(OpenOperatorPreviewSessionRequest) returns (OpenOperatorPreviewSessionReply);
  rpc OpenCameraConfigurationSession(OpenOperatorPreviewSessionRequest) returns (OpenOperatorPreviewSessionReply);
  rpc ConfigureOperatorSession(ConfigureOperatorSessionRequest) returns (ConfigureOperatorSessionReply);
  rpc OpenDraftPurePreviewSession(OpenOperatorPreviewSessionRequest) returns (OpenOperatorPreviewSessionReply);
  rpc CloseDraftPurePreviewSession(CloseOperatorPreviewSessionRequest) returns (CloseOperatorPreviewSessionReply);
  rpc StreamOperatorPreviewFrames(StreamOperatorPreviewFramesRequest) returns (stream OperatorPreviewFrame);
  rpc CloseOperatorPreviewSession(CloseOperatorPreviewSessionRequest) returns (CloseOperatorPreviewSessionReply);
  rpc ListRejectedOperators(ListRejectedOperatorsRequest) returns (ListRejectedOperatorsReply);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsReply);
  rpc ListGlobalCounters(ListGlobalCountersRequest) returns (ListGlobalCountersReply);
  rpc GetGlobalCounter(GetGlobalCounterRequest) returns (GetGlobalCounterReply);
  rpc SetGlobalCounter(SetGlobalCounterRequest) returns (SetGlobalCounterReply);
  rpc ResetGlobalCounter(ResetGlobalCounterRequest) returns (ResetGlobalCounterReply);
}

// Project-owned managed TCP, protocol v1. No workflow send RPC is exposed.
message CommunicationRequest {
  string protocol_version = 1;
  string project_id = 2;
  string runtime_instance_id = 3;
  string project_load_generation = 4;
  string request_id = 5;
  string action = 6; // SYNC, START, STOP, UNLOAD, PREPARE_DISABLE, ABORT_DISABLE.
  string config_json = 7;
  string expected_config_revision = 8;
  uint64 after_sequence = 9;
  string project_path = 10; // Required on controls; canonical Runtime project file.
  string save_token = 11; // Owner capability for a protected disable/save transaction.
}
message CommunicationReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string state_json = 4;
}

// Isolated operator debugging protocol v1. Never starts a production Job.
message OperatorDebugOutputRef { string execution_id = 1; string port = 2; }
message OperatorDebugValue {
  oneof value { string inline_json = 1; string asset_ref = 2; OperatorDebugOutputRef output_ref = 3; }
}
message OperatorDebugRequest {
  string runtime_instance_id = 1;
  string session_id = 2;
  uint64 generation = 3;
  string request_id = 4;
  string open_request_id = 5;
  string project_json = 6;
  string project_id = 7;
  string workflow_id = 8;
  string node_id = 9;
  string operator_id = 10;
  string resource_root = 11;
  map<string, OperatorDebugValue> inputs = 12;
  string input_set_id = 13;
  string params_json = 14;
  uint32 timeout_ms = 15;
  string execution_id = 16;
  uint64 after_sequence = 17;
  uint32 limit = 18;
  string asset_id = 19;
  uint64 offset = 20;
  uint64 total_bytes = 21;
  bytes content = 22;
  string mime_type = 23;
  string sha256 = 24;
  string provenance_json = 25;
  string control_json = 26;
}
message OperatorDebugReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string runtime_instance_id = 4;
  string session_id = 5;
  uint64 generation = 6;
  string state = 7;
  string execution_id = 8;
  string input_set_id = 9;
  string snapshot_json = 10;
  bytes content = 11;
}

message OpenPlcDebugSessionRequest {
  string project_id = 1;
  string workflow_id = 2;
  string node_id = 3;
  string operator_id = 4;
  string params_json = 5;
  string request_id = 6;
}

message ExecutePlcDebugCommandRequest {
  string session_id = 1;
  string runtime_instance_id = 2;
  string request_id = 3;
  string command = 4;
  string params_json = 5;
}

message ClosePlcDebugSessionRequest {
  string session_id = 1;
  string runtime_instance_id = 2;
}

message PlcDebugReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string session_id = 4;
  string runtime_instance_id = 5;
  string state = 6;
  bool write_enabled = 7;
  string result_json = 8;
  double elapsed_ms = 9;
  int64 timestamp_ms = 10;
  int32 ttl_ms = 11;
  uint64 write_lock_generation = 12;
}

message SqliteColumnPlan {
  string name = 1;
  string storage_type = 2;
  bool nullable = 3;
  bool has_default = 4;
  string default_json = 5;
}

message InspectSqliteTargetRequest {
  string database_path = 1;
  string project_directory = 2;
  string table = 3;
  repeated SqliteColumnPlan proposed_columns = 4;
}

message InitializeSqliteTargetRequest {
  string database_path = 1;
  string project_directory = 2;
  string table = 3;
  repeated SqliteColumnPlan columns = 4;
  bool confirmed = 5;
}

message SqliteColumnInfo {
  string name = 1;
  string declared_type = 2;
  string affinity = 3;
  bool nullable = 4;
  bool has_default = 5;
  string default_sql = 6;
  int32 primary_key = 7;
  bool generated = 8;
  bool auto_primary_key = 9;
}

message SqliteTargetReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string runtime_host = 4;
  string resolved_path = 5;
  bool exists = 6;
  repeated string tables = 7;
  repeated SqliteColumnInfo columns = 8;
  string structure_json = 9;
  string preview_sql = 10;
}

// Opt-in P2 service. Existing RuntimeService wire contract is unchanged.
service DisplayService {
  rpc Capabilities(DisplayEmpty) returns (DisplayCapabilities);
  rpc Prepare(DisplayPrepareRequest) returns (DisplayPrepared);
  rpc Start(DisplayStartRequest) returns (DisplayJob);
  rpc ListJobs(DisplayEmpty) returns (DisplayJobs);
  rpc GetJob(DisplayJobRequest) returns (DisplayJob);
  rpc Snapshot(DisplayRequest) returns (DisplaySnapshot);
  rpc Subscribe(DisplayRequest) returns (stream DisplaySnapshot);
  rpc ReadAsset(DisplayAssetRequest) returns (DisplayAsset);
  rpc AcquireLease(DisplayAssetRequest) returns (DisplayLease);
  rpc ReleaseLease(DisplayLease) returns (DisplayEmpty);
  rpc ReleaseJob(DisplayRequest) returns (DisplayEmpty);
  rpc DiscardPrepared(DisplayStartRequest) returns (DisplayEmpty);
}
message DisplayEmpty { string project_id = 1; }
message DisplayCapabilities {
  string runtime_instance_id = 1; string protocol_version = 2; repeated string capabilities = 3;
  string normal_capture_limits_json = 4;
}
message DisplayPrepareRequest { string project_json = 1; string resource_root = 2; map<string,string> site_values = 3; }
message DisplayPrepared { string prepared_id = 1; string execution_revision = 2; string capture_plan_revision = 3; }
message DisplayStartRequest { string prepared_id = 1; }
message DisplayJob {
  string job_id = 1; string status = 2;
  string project_id = 3; string workflow_id = 4; string mode = 5;
  bool capture_enabled = 6; repeated string source_ids = 7;
  string capture_plan_revision = 8; string execution_revision = 9;
  string start_request_id = 10; string sources_json = 11;
  string runtime_instance_id = 12; int64 accepted_at_ms = 13;
  bool resources_released = 14; string capture_definition_json = 15;
  string capture_limits_json = 16;
  string legacy_snapshot_policy = 17;
  string run_group_id = 18;
  string source_job_id = 19;
  string target_slot_id = 20;
}
message DisplayJobs { repeated DisplayJob jobs = 1; }
// Exact, read-only current-runtime lookup; does not read historical persisted Jobs.
message DisplayJobRequest { string runtime_instance_id = 1; string project_id = 2; string job_id = 3; }
message DisplayRequest { string runtime_instance_id = 1; string job_id = 2; uint64 after_cursor = 3; bool replay = 4; }
message DisplayIdentity {
  string runtime_instance_id = 1; string job_id = 2; string result_scope_id = 3;
  string invocation_id = 4; string result_key = 5; uint64 result_ordinal = 6;
  string execution_revision = 7; string capture_plan_revision = 8; string mode = 9;
}
message DisplayImage {
  string resource_id = 1; string owner_result_key = 2; uint64 byte_size = 3;
  string sha256 = 4; string mime_type = 5; string frame_identity = 6;
  string coordinate_space_id = 7; string trust = 8; string adapter_version = 9;
  string parent_frame_identity = 10;
}
message DisplaySource {
  string source_id = 1; string state = 2; optional string value_json = 3;
  DisplayImage image = 4; string reason_code = 5; string reason = 6;
}
message DisplayResult {
  DisplayIdentity identity = 1; repeated string expected_source_ids = 2;
  repeated DisplaySource sources = 3; string status = 4; string execution_terminal = 5;
  uint64 capture_started_ns = 6; uint64 scope_ended_ns = 7; uint64 closed_ns = 8;
  double owner_age_ms = 9;
}
message DisplaySnapshot {
  string runtime_instance_id = 1; string job_id = 2; uint64 cursor = 3;
  bool reset_required = 4; repeated DisplayResult results = 5;
  map<string,uint64> latest_started_ordinals = 6;
  map<string,uint64> expired_scope_ordinals = 7;
}
message DisplayAssetRequest { string runtime_instance_id = 1; string job_id = 2; string resource_id = 3; uint32 ttl_ms = 4; }
message DisplayAsset { bytes content = 1; string sha256 = 2; }
message DisplayLease { string lease_id = 1; string resource_id = 2; uint32 ttl_ms = 3; }
