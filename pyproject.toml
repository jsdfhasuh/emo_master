[project]
name = "emo_master"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "PySide2>=5.15",
  "grpcio>=1.62",
  "grpcio-tools>=1.62",
  "protobuf>=4.25",
  "pydantic>=2.6",
  "opencv-python>=4.9,<4.11",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.9", "ruff>=0.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
exclude = [
  "src/emo_master/apps/runtime/grpc_server/generated"
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = [
  "src/emo_master/apps/runtime/grpc_server/generated"
]
